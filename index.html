<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!--
  ============================================================================
  DOCUMENTOS DE INGRESO — Supertiendas Cañaveral S.A.S.
  ----------------------------------------------------------------------------
  Página donde el candidato sube sus documentos de ingreso (PDF; la foto 3×4 como imagen).
  La página:
    1. Pide nombre, cédula y cargo, y la autorización de tratamiento de datos.
    2. Muestra la lista de documentos y revisa cada archivo (que sea el documento
       correcto). Los documentos van en PDF; solo la foto 3×4 va como imagen.
    3. Cuando están todos, arma un ZIP con nombres estándar y lo descarga.
    4. Lleva al candidato a subir ese ZIP a la carpeta de Gestión Humana en
       OneDrive (link de "Solicitar archivos").

  PRIVACIDAD:
    - Esta página NO tiene servidor. Los archivos nunca se envían a GitHub
      ni a ningún otro lado: viven en el navegador del candidato.
    - Si el candidato dice que el dispositivo es suyo, el avance se guarda
      en SU navegador (IndexedDB) por unos días y luego se borra solo.
    - Si el dispositivo es prestado, no se guarda nada y la página se limpia
      sola tras unos minutos sin uso.

  ¿QUÉ SE PUEDE EDITAR SIN SABER PROGRAMAR?
    Solo el bloque "CONFIGURACIÓN" (busca "███ CONFIGURACIÓN ███" en este archivo):
    link de OneDrive, cargos y secciones, documentos, textos y reglas.
    Paso a paso de los cambios más comunes: GUIA.md (en el repositorio).

  MAPA DE ESTE ARCHIVO (en este orden):
    <style>              Colores de la marca, estilo iPhone, modo oscuro y diseño de PC.
    CONFIGURACIÓN        ← lo que se edita: links, reglas, textos.
                         (DOCUMENTOS en documentos.js y CARGOS en cargos.js, compartidos con el panel)
    LOGO                 Logo de Cañaveral incrustado (imagen convertida a texto base64).
    PANTALLA DE CARGA    "Cargando…" y los mensajes si la página no abre (sin conexión,
                         navegador muy antiguo).
    LIBRERÍAS            React, JSZip y pdf.js, con respaldo en jsDelivr si cdnjs falla.
    CÓDIGO DE LA APP     Ya compilado: NO se edita aquí. La versión para leer y editar
                         está en src/app.jsx; después se ejecuta "npm run compilar".

  OTROS ARCHIVOS DEL REPOSITORIO:
    src/app.jsx          Código de la app (pantallas, revisión de archivos, ZIP).
    documentos.js        Lista de documentos que se piden (la usan esta app y el panel).
    cargos.js            Lista de cargos y secciones (la usan esta app y el panel).
    GUIA.md              Cómo hacer los cambios más comunes, paso a paso.
    COMO_FUNCIONA.md     Cómo funciona por dentro (para programadores).
    PRUEBAS.md           Lista para probar en celulares reales.
    panel-gh.html        Panel de Gestión Humana (recibe los ZIP y pide correcciones).
    manual/              Manual del candidato en PDF (el de Gestión Humana no está aquí).

  MODO CORRECCIÓN:
    Si la dirección trae ?c=<código>, la página no hace el envío normal: muestra solo
    los documentos que Gestión Humana pidió corregir desde su panel (panel-gh.html).
    El formato del código está en src/app.jsx, sección 7 (CONTRATO con el panel).

  MODO PRUEBA:
    Abre la página con ?prueba=1 al final de la dirección para ver un
    selector abajo que llena la app con datos de prueba (no guarda nada).
    La opción "Corrección" abre el modo corrección con un link de ejemplo
    (cédula 1144098765). Con ?prueba=1&app=1 se ve el aviso de "Abre esta
    página en Chrome/Safari".
  ============================================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<!-- Color de la barra del navegador en el celular (uno para modo claro y otro para oscuro) -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F6EF" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08200F" />
<meta name="color-scheme" content="light dark" />
<!-- Si la guardan en la pantalla de inicio del iPhone, se abre como app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Documentos de ingreso · Cañaveral</title>

<!-- Nunito (tipografía corporativa del Manual de Marca) para los títulos; el resto usa la letra del iPhone -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />

<style>
  /* ==========================================================================
     ESTILO IPHONE (iOS)
     Colores de sistema de Apple + el verde de Cañaveral como color de acento.
     Todo se define aquí una vez; el modo oscuro solo cambia estos valores.
     ========================================================================== */
  :root {
    --tinte: #1D5A2B;                       /* acento: verde del logo Cañaveral */
    --texto-sobre-tinte: #FFFFFF;
    --tinte-suave: rgba(29, 90, 43, 0.12);  /* fondo de botones "tintados" */
    --lima: #7DD105;                        /* verde lima Cañaveral (avance, interruptor) */
    --tinta: #08200F;                       /* verde casi negro de la marca (portada) */
    --fondo: #F3F6EF;                       /* verde muy claro de la marca */
    --celda: #FFFFFF;                       /* fondo de las listas */
    --celda-presionada: #E6ECE1;
    --texto: #08200F;
    --texto-2: rgba(8, 32, 15, 0.6);        /* texto secundario */
    --separador: rgba(8, 32, 15, 0.16);
    --relleno: rgba(29, 90, 43, 0.09);      /* fondos verdes muy suaves */
    --rojo: #D93025;
    --alerta-fondo: #FFF4E5;
    --alerta-texto: #8A5300;
    --barra: rgba(243, 246, 239, 0.86);     /* barras translúcidas */
    --portada: #08200F;                     /* fondo de la portada de bienvenida */
    --sombra-flotante: 0 10px 30px rgba(8, 32, 15, 0.2);
    --radio: 12px;
    --ancho-contenido: 600px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinte: #7DD105;
      --texto-sobre-tinte: #08200F;
      --tinte-suave: rgba(125, 209, 5, 0.16);
      --fondo: #08200F;                     /* el verde oscuro de la marca */
      --celda: #10301A;
      --celda-presionada: #18402A;
      --texto: #FFFFFF;
      --texto-2: rgba(235, 245, 230, 0.62);
      --separador: rgba(125, 209, 5, 0.18);
      --relleno: rgba(255, 255, 255, 0.10);
      --rojo: #FF6B5E;
      --alerta-fondo: #2E2A10;
      --alerta-texto: #FFC24D;
      --barra: rgba(8, 32, 15, 0.86);
      --portada: #10301A;
    }
  }

  /* ==========================================================================
     AJUSTES PARA QUE SE SIENTA COMO APP EN EL CELULAR
     ========================================================================== */
  html {
    -webkit-tap-highlight-color: transparent; /* sin destello gris al tocar */
    -webkit-text-size-adjust: 100%;           /* sin texto agrandado al girar */
    overscroll-behavior: none;                /* sin "jalar para recargar" */
  }
  * { box-sizing: border-box; }
  /* Le avisa al navegador que la página maneja modo claro y oscuro, para que
     los controles nativos (desplegables, barras de scroll) usen el color correcto. */
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    /* -apple-system = San Francisco, la letra del iPhone */
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    font-size: 17px;            /* tamaño de texto normal en iOS */
    line-height: 1.35;
    letter-spacing: -0.2px;
    background: var(--fondo);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
  }
  /* 16px o más en campos: evita que el iPhone haga zoom al escribir */
  input, select, textarea, button { font: inherit; font-size: 17px; color: inherit; letter-spacing: inherit; }
  /* Controles: respuesta inmediata al toque y sin seleccionar su texto */
  button, a, .fila-tocable {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  a { color: var(--tinte); text-decoration: none; }
  :focus-visible { outline: 3px solid var(--lima); outline-offset: 2px; }
  .oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ==========================================================================
     ESTRUCTURA
     ========================================================================== */
  .app { min-height: 100dvh; display: flex; flex-direction: column; }
  .contenido {
    width: 100%;
    max-width: var(--ancho-contenido);
    margin: 0 auto;
    padding: 12px 16px 28px;
    flex: 1;
  }

  /* --- Barra de navegación translúcida (como las apps de Apple) --- */
  .barra-nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--barra);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separador);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  }
  .barra-nav-interna { max-width: calc(var(--ancho-contenido) - 32px); margin: 0 auto; }
  .nav-fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  /* Logo de Cañaveral (verde). En modo oscuro se vuelve blanco con un filtro. */
  .logo { display: block; width: auto; }
  .logo-nav { height: 30px; }
  .logo-blanco { filter: brightness(0) invert(1); }
  @media (prefers-color-scheme: dark) { .logo-nav { filter: brightness(0) invert(1); } }

  /* Portada de bienvenida: verde oscuro de la marca con la curva lima de las piezas de Cañaveral */
  .portada {
    position: relative; overflow: hidden;
    background: var(--portada); color: #FFFFFF;
    border-radius: 20px; padding: 24px 20px 22px; margin: 4px 0 28px;
  }
  .portada::after {               /* curva lima decorativa (como en los banners de la marca) */
    content: ''; position: absolute; right: -160px; top: -70px;
    width: 220px; height: 300px; border-radius: 50%;
    border: 22px solid var(--lima);
  }
  .portada > * { position: relative; z-index: 1; max-width: 76%; }
  .portada .logo { height: 44px; margin-bottom: 18px; max-width: 100%; }
  .portada h1 { color: #FFFFFF; margin: 0 0 6px; }
  .portada p { color: rgba(255, 255, 255, 0.78); font-size: 16px; }
  .nav-paso { font-size: 15px; color: var(--texto-2); margin: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* --- La "caña": barra de avance hecha de nudos, uno por documento --- */
  .cana { display: flex; gap: 4px; margin-top: 10px; }
  .nudo {
    flex: 1; height: 6px; border-radius: 3px;
    background: var(--relleno);
    transition: background 250ms ease-out;
  }
  .nudo.lleno { background: var(--lima); }
  .cana-texto {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 13px; color: var(--texto-2); margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  /* --- Títulos (título grande de iOS) --- */
  h1 { font-family: 'Nunito', -apple-system, sans-serif; font-size: 33px; line-height: 1.12; font-weight: 900; letter-spacing: 0; margin: 8px 0 6px; }
  .bajada { color: var(--texto-2); font-size: 17px; margin: 0 0 24px; }
  p { margin: 0; }

  /* ==========================================================================
     LISTAS AGRUPADAS (el estilo de la app Ajustes del iPhone)
     ========================================================================== */
  .grupo { margin-bottom: 28px; }
  .grupo-titulo { font-size: 13px; color: var(--texto-2); margin: 0 16px 7px; }
  .grupo-pie { font-size: 13px; color: var(--texto-2); margin: 7px 16px 0; }
  .grupo-pie.error { color: var(--rojo); }
  .lista { background: var(--celda); border-radius: var(--radio); overflow: hidden; }

  .fila {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    min-height: 44px; padding: 11px 16px;
  }
  /* Línea separadora fina entre filas, con sangría como en iOS */
  .fila + .fila::before {
    content: ''; position: absolute; top: 0; right: 0;
    left: var(--sangria, 16px);
    height: 0.5px; background: var(--separador);
  }
  .fila-con-icono { --sangria: 58px; align-items: flex-start; }
  .fila-tocable { cursor: pointer; }
  .fila-tocable:active { background: var(--celda-presionada); }
  .fila-cuerpo { flex: 1; min-width: 0; }
  .fila-titulo { font-size: 17px; font-weight: 400; }
  .fila-titulo.fuerte { font-weight: 600; }
  .fila-sub { font-size: 15px; color: var(--texto-2); margin-top: 2px; }
  .fila-nombre { overflow-wrap: anywhere; }
  .marca-check { color: var(--tinte); flex-shrink: 0; display: flex; }

  /* --- Campos de texto dentro de la lista --- */
  .fila-campo { display: block; padding: 9px 16px 10px; }
  .sugerencia { --sangria: 16px; }
  /* Las sugerencias van dentro de su propio contenedor: se les pone la línea separadora a mano */
  #lista-cargos > .fila::before, #lista-cargos + .fila::before {
    content: ''; position: absolute; top: 0; right: 0; left: 16px;
    height: 0.5px; background: var(--separador);
  }
  .sugerencia .fila-titulo { font-size: 16px; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .fila-campo .etiqueta { display: block; font-size: 13px; color: var(--texto-2); margin-bottom: 2px; }
  .fila-campo input, .fila-campo select {
    width: 100%; border: 0; outline: 0; padding: 2px 0;
    background: transparent; min-height: 28px;
    -webkit-appearance: none; appearance: none;
  }
  .fila-campo input::placeholder { color: var(--texto-2); opacity: 0.7; }
  /* Opciones del desplegable de cargos: colores explícitos para que en modo oscuro
     no queden en letra blanca sobre fondo blanco (pasaba en Chrome de Windows). */
  .fila-campo select option { background: var(--celda); color: var(--texto); }
  .fila-campo.con-error .etiqueta { color: var(--rojo); }
  .selector-con-flecha { position: relative; }
  .selector-con-flecha::after {
    content: ''; position: absolute; right: 2px; top: 50%;
    width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid var(--texto-2); border-bottom: 2px solid var(--texto-2);
    transform: rotate(45deg); pointer-events: none;
  }
  .selector-con-flecha select { padding-right: 24px; }

  /* --- Interruptor tipo iOS (para la autorización) --- */
  .interruptor {
    -webkit-appearance: none; appearance: none;
    width: 51px; height: 31px; border-radius: 31px; margin: 0;
    background: var(--relleno); position: relative; flex-shrink: 0; cursor: pointer;
    transition: background 200ms ease-out;
  }
  .interruptor::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
    transition: transform 200ms ease-out;
  }
  .interruptor:checked { background: var(--lima); }
  .interruptor:checked::after { transform: translateX(20px); }

  /* --- Círculo de estado (número o palomita) --- */
  .circulo {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: var(--relleno); color: var(--texto-2);
    margin-top: 1px;
  }
  .circulo.hecho { background: var(--lima); color: #05200b; }
  .circulo.activo { background: var(--tinte); color: var(--texto-sobre-tinte); }

  /* --- Archivos subidos dentro de un documento --- */
  .archivo {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--relleno); border-radius: 10px;
    padding: 7px 12px; margin-top: 8px; font-size: 15px;
  }
  .archivo-nombre { flex: 1 1 150px; min-width: 0; overflow-wrap: anywhere; }
  .archivo-peso { color: var(--texto-2); }
  .archivo-acciones { display: flex; gap: 16px; flex-shrink: 0; }
  .archivo-acciones .boton-texto { font-size: 15px; min-height: 32px; }
  .doc-error { color: var(--rojo); font-size: 15px; margin-top: 8px; }
  .doc-acciones { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }

  /* ==========================================================================
     BOTONES (estilo iOS: relleno, tintado y de texto)
     ========================================================================== */
  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 20px; border: 0; border-radius: 14px;
    font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none;
    transition: opacity 120ms ease-out;
  }
  .boton:active:not(:disabled) { opacity: 0.6; }      /* iOS atenúa al tocar */
  .boton:disabled, .boton[aria-disabled="true"] { cursor: not-allowed; }
  .boton-principal:disabled { background: var(--relleno); color: var(--texto-2); }
  .boton-tintado:disabled, .boton-chico:disabled { opacity: 0.45; }
  .boton-principal { width: 100%; background: var(--tinte); color: var(--texto-sobre-tinte); }
  .boton-tintado { background: var(--tinte-suave); color: var(--tinte); }
  .boton-chico { min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
  .boton-texto {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--tinte); font-size: 17px; min-height: 44px;
  }
  .boton-texto:active { opacity: 0.5; }
  .boton-texto.peligro { color: var(--rojo); }
  .boton-texto:disabled { opacity: 0.35; }
  @media (hover: hover) and (pointer: fine) {
    .boton:hover:not(:disabled) { opacity: 0.85; }
    .fila-tocable:hover { background: var(--celda-presionada); }
  }
  .boton-centrado { display: flex; justify-content: center; margin-top: 4px; }

  /* --- Barra de acción inferior translúcida (respeta la barra de inicio del iPhone) --- */
  .barra-accion {
    position: sticky; bottom: 0; z-index: 10;
    background: var(--barra);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--separador);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .barra-accion-interna { max-width: calc(var(--ancho-contenido) - 32px); margin: 0 auto; }
  .barra-accion .nota { text-align: center; font-size: 13px; margin: 7px 0 0; color: var(--texto-2); }

  /* --- Avisos --- */
  .aviso { border-radius: var(--radio); padding: 12px 16px; font-size: 15px; margin-bottom: 20px; }
  .aviso-info { background: var(--tinte-suave); color: var(--texto); }
  .aviso-alerta { background: var(--alerta-fondo); color: var(--alerta-texto); }
  .aviso-error { background: var(--alerta-fondo); color: var(--rojo); }

  /* --- Pantalla final --- */
  .final { text-align: center; padding-top: 48px; }
  .final-icono {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 20px;
    background: var(--lima); color: #05200b; display: grid; place-items: center;
  }
  .final .bajada { margin-bottom: 28px; }
  .final .aviso { text-align: left; }

  /* --- Aviso de inactividad (dispositivo prestado) --- */
  .aviso-flotante {
    position: fixed; left: 16px; right: 16px; z-index: 30;
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    max-width: calc(var(--ancho-contenido) - 32px); margin: 0 auto;
    background: var(--celda); color: var(--texto);
    border-radius: 16px; padding: 14px 16px; box-shadow: var(--sombra-flotante);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .aviso-flotante p { flex: 1 1 200px; font-size: 15px; font-variant-numeric: tabular-nums; }

  /* --- Selector del MODO PRUEBA (solo con ?prueba=1), como control segmentado de iOS --- */
  .selector-prueba {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; padding: 2px; border-radius: 9px;
    background: var(--relleno); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .selector-prueba button {
    border: 0; background: transparent; border-radius: 7px;
    padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .selector-prueba button.activo { background: var(--celda); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12); }

  /* --- Hoja de confirmación (como las "action sheets" de iOS) --- */
  .hoja-fondo {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.4);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 8px calc(8px + env(safe-area-inset-bottom, 0px));
    animation: aparecer 180ms ease-out;
  }
  .hoja { width: 100%; max-width: 500px; animation: subir 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .hoja-grupo { background: var(--celda); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  .hoja-mensaje { font-size: 13px; color: var(--texto-2); text-align: center; padding: 14px 16px; border-bottom: 0.5px solid var(--separador); }
  .hoja-boton {
    display: block; width: 100%; min-height: 57px; border: 0; cursor: pointer;
    background: var(--celda); color: var(--tinte); font-size: 20px;
  }
  .hoja-boton:active { background: var(--celda-presionada); }
  .hoja-boton.peligro { color: var(--rojo); }
  .hoja-cancelar { border-radius: 14px; font-weight: 600; }
  /* --- Tutorial "¿Cómo lo saco?" (hoja alta con scroll propio) --- */
  .boton-como {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
    background: var(--tinte-suave); color: var(--tinte); border: 0; cursor: pointer;
    font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px; min-height: 28px;
  }
  .boton-como:active { opacity: 0.6; }
  .hoja.tutorial {
    background: var(--celda); border-radius: 16px 16px 14px 14px;
    max-height: calc(100dvh - 40px); display: flex; flex-direction: column; overflow: hidden;
    --tinta-ilus: #08200F;
  }
  .hoja.tutorial:focus { outline: none; }
  .tutorial-agarre { width: 36px; height: 5px; border-radius: 3px; background: var(--separador); margin: 8px auto 0; flex-shrink: 0; }
  .tutorial-cabecera { display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; flex-shrink: 0; }
  .tutorial-titulo { flex: 1; margin: 0; font-family: 'Nunito', -apple-system, sans-serif; font-size: 21px; font-weight: 900; line-height: 1.2; }
  .tutorial-cerrar {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; flex-shrink: 0;
    background: var(--relleno); color: var(--texto-2); font-size: 14px;
  }
  .tutorial-cuerpo { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 8px; }
  .tutorial-intro { font-size: 15px; color: var(--texto-2); margin: 0 0 12px; }
  .tutorial-pasos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .tutorial-paso { display: flex; gap: 14px; align-items: flex-start; background: var(--relleno); border-radius: 14px; padding: 12px; }
  .ilustracion { width: 96px; height: auto; flex-shrink: 0; }
  .ilustracion text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  .tutorial-paso-texto { flex: 1; min-width: 0; }
  .tutorial-paso-texto p { font-size: 15px; line-height: 1.45; margin: 2px 0 8px; }
  .tutorial-numero { font-size: 12px; font-weight: 700; color: var(--tinte); }
  .tutorial-subtitulo { font-size: 13px; color: var(--texto-2); margin: 18px 0 8px; font-weight: 600; }
  .tutorial-enlaces { display: flex; flex-wrap: wrap; gap: 8px; }
  .tutorial-nota { font-size: 13px; color: var(--texto-2); margin: 14px 0 4px; }
  .tutorial-pie { padding: 10px 16px 12px; border-top: 0.5px solid var(--separador); flex-shrink: 0; }
  @media (prefers-color-scheme: dark) { .hoja.tutorial { --tinta-ilus: #000000; } }

  @keyframes aparecer { from { opacity: 0; } }
  @keyframes subir { from { transform: translateY(100%); } }

  @media (prefers-reduced-motion: reduce) {
    .hoja-fondo, .hoja { animation: none; }
    * { transition: none !important; }
  }

  /* --- Pantalla de carga (antes de que abra la app) --- */
  .carga-inicial {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; max-width: 420px; margin: 0 auto;
  }
  .carga-logo { height: 40px; width: auto; }
  @media (prefers-color-scheme: dark) { .carga-logo { filter: brightness(0) invert(1); } }
  .carga-rueda {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--relleno); border-top-color: var(--lima);
    animation: girar 0.9s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .carga-rueda { animation-duration: 2.5s; } }
  .carga-texto { font-size: 17px; font-weight: 600; margin: 0; }
  .carga-detalle { font-size: 15px; color: var(--texto-2); margin: 0; }
  .carga-detalle:empty { display: none; }
  .carga-boton { max-width: 260px; }
  .carga-boton[hidden] { display: none; } /* el estilo de .boton no debe ganarle a "hidden" */

  /* --- Aviso: la página está abierta dentro de Instagram, Facebook, TikTok… --- */

  .aviso-app ol { margin: 8px 0 0; padding-left: 20px; }
  .aviso-app .enlace-pagina {

    user-select: all; -webkit-user-select: all;

  .aviso-app .doc-acciones { margin-top: 4px; }
  .ayuda-movil {
    display: flex; align-items: center; gap: 12px; margin: 0 0 24px;
    background: var(--celda); color: var(--texto); border-radius: var(--radio); padding: 12px 16px;
  }
  .ayuda-movil:active { background: var(--celda-presionada); }
  .ayuda-movil-icono {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    background: var(--tinte-suave); color: var(--tinte); font-weight: 700;
  }
  .ayuda-movil-titulo { display: block; font-weight: 600; }
  .ayuda-movil-sub { display: block; font-size: 15px; color: var(--texto-2); }
  .ayuda-movil-flecha { font-size: 24px; color: var(--texto-2); }

  .motivo-gh { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: var(--rojo); overflow-wrap: anywhere; }
  .error-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* ==========================================================================
     COMPUTADOR (pantallas anchas): columna central + pasos a la izquierda

     ========================================================================== */
  .lateral { display: none; }
  .escritorio { flex: 1; display: flex; flex-direction: column; }
  .columna-central { display: contents; }

    .portada { padding: 30px 28px 28px; }
    .lateral { display: block; position: sticky; top: 84px; padding-top: 24px; }
    .lateral-titulo { font-size: 13px; color: var(--texto-2); margin: 0 0 10px 4px; font-weight: 400; }
    .pasos-lista { list-style: none; margin: 0; padding: 0; }
    .paso-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; color: var(--texto-2); font-size: 15px; }
    .paso-item .circulo { margin-top: 0; }

    .paso-item.hecho { color: var(--texto); }
    .tarjeta-ayuda { background: var(--celda); border-radius: var(--radio); padding: 16px; margin-bottom: 14px; font-size: 15px; }
    .tarjeta-ayuda h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }

  }

     8. ARRANQUE             Abre el envío normal o el modo corrección según la dirección.

              En el modo corrección es otra sesión, guardada con otra clave (ver sección 7).

const {
  useState,
  useEffect,
  useRef,
  useMemo
} = React;
/** Configuración editable (bloque CONFIGURACIÓN de index.html). */
const CONFIG = window.CONFIG;
/** Logo de Cañaveral en texto (base64), también definido en index.html. */
const LOGO = window.LOGO_CANAVERAL;

/* ============================================================================
   1. GUARDADO LOCAL (IndexedDB)
   ----------------------------------------------------------------------------
   IndexedDB es una "base de datos" que trae el navegador. Todo lo que se guarda
   aquí queda SOLO en el celular/computador del candidato: no viaja a internet.
   El envío normal se guarda en un registro llamado "actual". Cada corrección
   (sección 7) usa su propia clave, "correccion_<huella>_<n>", para no mezclarse.
   ============================================================================ */
const BD = {
  nombre: 'canaveral_documentos_ingreso',
  almacen: 'sesion',
  clave: 'actual',
  /** Abre (o crea) la base de datos local. */
  abrir() {
    return new Promise((resolver, rechazar) => {
      if (!window.indexedDB) return rechazar(new Error('Este navegador no permite guardar datos.'));
      const solicitud = indexedDB.open(this.nombre, 1);
      solicitud.onupgradeneeded = () => solicitud.result.createObjectStore(this.almacen);
      solicitud.onsuccess = () => resolver(solicitud.result);
      solicitud.onerror = () => rechazar(solicitud.error);
    });
  },
  /** Ejecuta una operación ('readonly' o 'readwrite') sobre el almacén. */
  async operar(modo, accion) {
    const bd = await this.abrir();
    return new Promise((resolver, rechazar) => {
      const transaccion = bd.transaction(this.almacen, modo);
      const solicitud = accion(transaccion.objectStore(this.almacen));
      transaccion.oncomplete = () => {
        bd.close();
        resolver(solicitud && solicitud.result);
      };
      transaccion.onerror = () => {
        bd.close();
        rechazar(transaccion.error);
      };
    });
  },
  // "clave" es opcional: sin ella se usa "actual" (envío normal)
  leer() {
    let clave = arguments.length > 0 && arguments[0] !== undefined ? arguments[0] : this.clave;
    return this.operar('readonly', a => a.get(clave));
  },
  guardar(valor) {
    let clave = arguments.length > 1 && arguments[1] !== undefined ? arguments[1] : this.clave;
    return this.operar('readwrite', a => a.put(valor, clave));
  },
  borrar() {
    let clave = arguments.length > 0 && arguments[0] !== undefined ? arguments[0] : this.clave;
    return this.operar('readwrite', a => a.delete(clave));
  }
};

/* ============================================================================
   2. FUNCIONES DE APOYO (no dibujan nada en pantalla)
   ============================================================================ */

/* ---------------------------------------------------------------------------
   2.1 TEXTOS Y FORMATOS
   --------------------------------------------------------------------------- */

const MS_POR_DIA = 24 * 60 * 60 * 1000;

/** "1 documento" / "3 documentos". */
function plural(cantidad, singular, pluralTexto) {
  return `${cantidad} ${cantidad === 1 ? singular : pluralTexto}`;
}

/** Peso legible: 845 KB, 2,4 MB. */
function pesoLegible(bytes) {
  if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  return `${(bytes / (1024 * 1024)).toLocaleString('es-CO', {
    maximumFractionDigits: 1
  })} MB`;
}

/** Fecha legible: "12 de noviembre". */
function fechaLegible(ms) {
  return new Date(ms).toLocaleDateString('es-CO', {
    day: 'numeric',
    month: 'long'
  });
}

/**
 * Convierte un texto en algo seguro para nombre de archivo:
 * "María José Peña" → "MARIA_JOSE_PENA". Quita tildes, ñ y símbolos.
 */
function textoParaArchivo(texto) {
  let maximo = arguments.length > 1 && arguments[1] !== undefined ? arguments[1] : 40;
  const limpio = (texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita tildes (la ñ queda como n)
  .replace(/[^A-Za-z0-9]+/g, '_') // todo lo raro → guion bajo
  .replace(/^_+|_+$/g, '').toUpperCase();
  if (limpio.length <= maximo) return limpio;
  // Si es muy largo, se corta en la última palabra completa (no deja "VILLEGAS_D").
  const cortado = limpio.slice(0, maximo);
  const ultimoGuion = cortado.lastIndexOf('_');
  return (ultimoGuion > 0 ? cortado.slice(0, ultimoGuion) : cortado).replace(/_+$/g, '');
}

/** Texto en mayúsculas, sin tildes ni espacios dobles: sirve para comparar y buscar. */
function normalizar(texto) {
  return (texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}

/* ---------------------------------------------------------------------------
   2.2 CARGOS Y DOCUMENTOS QUE APLICAN A CADA CANDIDATO
   La lista de cargos viene de CONFIG.cargosTexto (pegada desde Excel). Según el
   cargo, la sección y si es su primer empleo, cambia la lista de documentos.
   --------------------------------------------------------------------------- */

/**
 * Convierte el texto pegado desde Excel (CARGO, SECCIÓN, MANIPULACIÓN separados por
 * tabulación o por ;) en una lista de puestos: [{ cargo, seccion, manipulacion }].
 * Ignora líneas vacías y la fila de encabezado si alguien la pega.
 */
function leerPuestos(texto) {
  const equivalencias = {
    NO: 'no',
    GENERAL: 'general',
    DECRETO1500: 'decreto1500'
  };
  return (texto || '').split(/\r?\n/).map(linea => linea.split(/\t|;/).map(celda => celda.trim())).filter(_ref => {
    let [cargo, seccion] = _ref;
    return cargo && seccion && normalizar(cargo) !== 'CARGO';
  }).map(_ref2 => {
    let [cargo, seccion, manipulacion] = _ref2;
    return {
      cargo,
      seccion,
      manipulacion: equivalencias[normalizar(manipulacion).replace(/\s/g, '')] || 'no'
    };
  });
}

/** Todos los puestos (cargo + sección) de la CONFIGURACIÓN. */
const PUESTOS = leerPuestos(CONFIG.cargosTexto);
/** Nombres de cargo sin repetir y en orden alfabético (para el buscador). */
const CARGOS_UNICOS = [...new Set(PUESTOS.map(p => p.cargo))].sort((a, b) => a.localeCompare(b, 'es'));

/** Secciones donde existe un cargo. */
function seccionesDelCargo(cargo) {
  return PUESTOS.filter(p => p.cargo === cargo).map(p => p.seccion).sort((a, b) => a.localeCompare(b, 'es'));
}

/** Busca la combinación cargo + sección. */
function buscarPuesto(cargo, seccion) {
  return PUESTOS.find(p => p.cargo === cargo && p.seccion === seccion) || null;
}

/**
 * Buscador de cargos: devuelve los que contienen TODAS las palabras escritas,
 * sin importar tildes ni mayúsculas ("aux fruver" encuentra "AUXILIAR DE FRUVER").
 * Primero los que empiezan por la primera palabra.
 */
function buscarCargos(texto) {
  let limite = arguments.length > 1 && arguments[1] !== undefined ? arguments[1] : 8;
  const palabras = normalizar(texto).split(' ').filter(Boolean);
  if (palabras.length === 0) return [];
  const empiezaIgual = c => normalizar(c).startsWith(palabras[0]) ? 0 : 1;
  return CARGOS_UNICOS.filter(c => palabras.every(p => normalizar(c).includes(p))).sort((a, b) => empiezaIgual(a) - empiezaIgual(b) || a.localeCompare(b, 'es')).slice(0, limite);
}

/**
 * Devuelve solo los documentos que aplican al candidato:
 *   - según su cargo y sección (manipulación de alimentos), y
 *   - según si es su primer empleo: no se piden pensión ni referencia laboral,
 *     y en cambio se piden referencias personales.
 */
function documentosQueAplican(datos) {
  const puesto = buscarPuesto(datos.cargo, datos.seccion);
  return CONFIG.documentos.filter(doc => {
    if (doc.soloAprendiz) return false; // se pide solo en el link de aprendiz
    if (doc.omitirSiPrimerEmpleo && datos.primerEmpleo) return false;
    if (doc.soloSiPrimerEmpleo && !datos.primerEmpleo) return false;
    if (doc.requerido !== 'segunCargo') return true;
    return puesto && puesto.manipulacion !== 'no';
  });
}

/**
 * ¿El documento ya está completo? Casi todos con 1 archivo; los que tienen "cantidad"
 * (ej. 2 referencias personales) necesitan exactamente esa cantidad.
 */
function documentoCompleto(doc, archivos) {
  return (archivos || []).length >= (doc.cantidad || 1);
}

/** Texto de ayuda del documento; cambia para puestos bajo Decreto 1500. */
function ayudaDelDocumento(doc, datos) {
  const puesto = buscarPuesto(datos.cargo, datos.seccion);
  if (doc.ayudaDecreto1500 && puesto && puesto.manipulacion === 'decreto1500') return doc.ayudaDecreto1500;
  return doc.ayuda;
}

/* ---------------------------------------------------------------------------
   2.3 REVISIÓN DE LOS PDF
   Flujo: revisarArchivo() → (huellaDelArchivo, leerPdf) → acepta o devuelve un mensaje.
   Si el PDF tiene texto se revisa el contenido; si es escaneado, el nombre del archivo.
   --------------------------------------------------------------------------- */

// pdf.js trabaja con un "ayudante" en segundo plano (worker) que se carga del mismo sitio.
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDF_DESDE_RESPALDO ? 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' : 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/**
 * Huella digital del archivo (SHA-256): dos archivos idénticos tienen la misma huella.
 * Sirve para detectar que suban el mismo PDF en dos documentos distintos.
 */
async function huellaDelArchivo(archivo, bytesYaLeidos) {
  try {
    const bytes = bytesYaLeidos || (await archivo.arrayBuffer());
    const resumen = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(resumen)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    return `${archivo.size}-${archivo.name}`; // respaldo si el navegador no permite calcularla
  }
}

/**
 * Abre el PDF con pdf.js: cuenta las páginas, saca el texto de las primeras 3 y
 * mira si traen alguna imagen (foto o escaneo).
 * Si el PDF tiene contraseña, prueba con la cédula del candidato (casi todos los
 * certificados de EPS y fondos de pensión usan la cédula como clave).
 * Devuelve { paginas, texto, tieneImagen, claveEsCedula },
 * { protegido: true } si tiene una contraseña distinta (no se puede leer, pero se acepta)
 * o { error } si está dañado.
 * Si pdf.js no cargó (sin internet), devuelve { paginas: null } y no bloquea.
 */
async function leerPdf(bytes, cedula) {
  if (!window.pdfjsLib) return {
    paginas: null,
    texto: '',
    tieneImagen: null
  };

  // Cada intento recibe su propia copia de los bytes (pdf.js se queda con la que recibe).
  let tarea = null;
  const abrir = clave => {
    if (tarea) tarea.destroy();
    tarea = pdfjsLib.getDocument({
      data: new Uint8Array(bytes.slice(0)),
      password: clave
    });
    return tarea.promise;
  };
  try {
    let pdf;
    let claveEsCedula = false;
    try {
      pdf = await abrir(undefined);
    } catch (e) {
      if (!(e && e.name === 'PasswordException' && cedula)) throw e;
      pdf = await abrir(cedula); // segundo intento: la cédula como contraseña
      claveEsCedula = true;
    }
    // 1) Texto de las primeras 3 páginas (es lo rápido)
    const paginasARevisar = Math.min(pdf.numPages, 3);
    let texto = '';
    for (let n = 1; n <= paginasARevisar; n++) {
      const pagina = await pdf.getPage(n);
      const contenido = await pagina.getTextContent();
      texto += ' ' + contenido.items.map(item => item.str).join(' ');
      pagina.cleanup();
    }
    // 2) Buscar imágenes es lento: solo se hace si casi no hay texto (escaneo o PDF en blanco)
    let tieneImagen = null;
    if (texto.replace(/[^A-Za-z0-9]/g, '').length < 30) {
      const OPS = pdfjsLib.OPS;
      const dibujosDeImagen = [OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintImageMaskXObject, OPS.paintJpegXObject].filter(Boolean);
      tieneImagen = false;
      for (let n = 1; n <= paginasARevisar && !tieneImagen; n++) {
        const pagina = await pdf.getPage(n);
        const operaciones = await pagina.getOperatorList();
        tieneImagen = operaciones.fnArray.some(op => dibujosDeImagen.includes(op));
        pagina.cleanup();
      }
    }
    return {
      paginas: pdf.numPages,
      texto,
      tieneImagen,
      claveEsCedula
    };
  } catch (e) {
    // Tiene una contraseña que no es la cédula: al candidato le cuesta quitarla,
    // así que se acepta sin revisar el contenido y lo revisa Gestión Humana.
    if (e && e.name === 'PasswordException') return {
      protegido: true,
      paginas: null,
      texto: '',
      tieneImagen: null
    };
    if (e && (e.name === 'InvalidPDFException' || e.name === 'MissingPDFException')) {
      return {
        error: 'El PDF está dañado y no se puede abrir. Vuelve a generarlo.'
      };
    }
    return {
      paginas: null,
      texto: '',
      tieneImagen: null
    }; // otro problema técnico: no bloqueamos al candidato
  } finally {
    // Libera la memoria del PDF (importante en celulares con poca memoria)
    if (tarea) tarea.destroy();
  }
}

/**
 * Revisa que el NOMBRE del archivo diga qué documento es.
 * "Acta de Bachiller.pdf" → palabras ACTA, DE, BACHILLER, PDF → coincide con "BACHILLER".
 * Cada palabra del nombre se compara por su comienzo ("TECNIC" sirve para TÉCNICO y TÉCNICA).
 */
function nombreIdentificaDocumento(nombreArchivo, palabrasClave) {
  if (!palabrasClave || palabrasClave.length === 0) return true;
  const palabrasDelNombre = normalizar(nombreArchivo.replace(/\.pdf$/i, '')).split(/[^A-Z0-9]+/).filter(Boolean);
  return palabrasDelNombre.some(palabra => palabrasClave.some(clave => palabra.startsWith(clave)));
}

/**
 * ¿El texto del PDF se parece más a OTRO documento que a este?
 * Cuenta las palabras "distintivas" de cada documento que aparecen en el texto.
 * Devuelve el documento al que más se parece (si gana claramente), o null.
 */
function pareceOtroDocumento(texto, doc) {
  const puntaje = d => (d.revision && d.revision.distintivas || []).filter(p => texto.includes(p)).length;
  const propio = puntaje(doc);
  let mejor = null;
  let mejorPuntaje = 0;
  for (const otro of CONFIG.documentos) {
    if (otro.id === doc.id || otro.tipo === 'imagen') continue;
    const p = puntaje(otro);
    if (p > mejorPuntaje) {
      mejor = otro;
      mejorPuntaje = p;
    }
  }
  // Solo se rechaza si es claro: el PDF no trae NINGUNA palabra propia de este documento,
  // o trae al menos 2 palabras más del otro. Así no se rechazan documentos buenos que
  // mencionan de pasada otro tema (ej. una referencia laboral que dice "afiliado a pensión").
  const claro = mejorPuntaje > propio && (propio === 0 || mejorPuntaje >= propio + 2);
  return claro ? mejor : null;
}

/**
 * Revisa un archivo antes de aceptarlo para un documento:
 *   1. Que sea un PDF real, no vacío y no muy pesado.
 *   2. Que no sea el mismo archivo ya subido en otro documento.
 *   3. Que no tenga más páginas de las esperadas.
 *   4. Que no esté en blanco: debe traer texto o una imagen (foto/escaneo).
 *   5. Si el PDF tiene texto: que tenga alguna palabra clave del documento y que no
 *      se parezca más a otro documento (ej. el certificado de pensión subido como EPS).
 *   6. Si el PDF es escaneado o tiene clave (no se puede leer): el NOMBRE del archivo
 *      debe decir qué documento es (ej. "acta_bachiller.pdf"). Queda para revisión de GH.
 * Devuelve { error } si no se acepta, o { item } con el archivo listo para guardar.
 */
async function revisarArchivo(archivo, doc, cedula, archivosActuales) {
  if (!archivo) return {
    error: 'No se seleccionó ningún archivo.'
  };
  if (archivo.size === 0) return {
    error: 'El archivo está vacío. Vuelve a generarlo e inténtalo otra vez.'
  };
  const maximo = CONFIG.tamanoMaximoMB * 1024 * 1024;
  if (archivo.size > maximo) {
    return {
      error: `Pesa ${pesoLegible(archivo.size)} y el máximo es ${CONFIG.tamanoMaximoMB} MB. Comprímelo gratis y vuelve a subirlo.`,
      comprimir: true
    };
  }
  // Todo PDF real tiene la marca "%PDF-" al inicio (no basta con que el nombre termine en .pdf)
  const inicio = await archivo.slice(0, 1024).text();
  if (!inicio.includes('%PDF-')) {
    return {
      error: 'Ese archivo no es un PDF. Si tienes una foto, conviértela a PDF antes de subirla.'
    };
  }

  // El archivo se lee UNA sola vez y esos bytes se usan para la huella y para pdf.js
  const bytes = await archivo.arrayBuffer();

  // ¿Ya subió este mismo archivo en otro documento (o en este)?
  const huella = await huellaDelArchivo(archivo, bytes);
  for (const otro of CONFIG.documentos) {
    if ((archivosActuales[otro.id] || []).some(item => item.huella === huella)) {
      return {
        error: otro.id === doc.id ? 'Ya subiste este mismo archivo aquí.' : `Este mismo archivo ya lo subiste en "${otro.nombre}". Cada documento va en su lugar.`
      };
    }
  }
  const reglas = doc.revision || {};
  const lectura = await leerPdf(bytes, cedula);
  if (lectura.error) return {
    error: lectura.error
  };
  if (reglas.paginasMax && lectura.paginas && lectura.paginas > reglas.paginasMax) {
    return {
      error: `Tiene ${lectura.paginas} páginas y este documento debe tener máximo ${reglas.paginasMax}. Revisa que sea el documento correcto.`
    };
  }

  // Solo se puede revisar el contenido si el PDF tiene texto (no es una foto escaneada)
  const texto = normalizar(lectura.texto);
  const tieneTexto = texto.replace(/[^A-Z0-9]/g, '').length >= 30;
  const leido = lectura.paginas !== null; // false si tiene contraseña o pdf.js no pudo revisar (no bloqueamos)

  if (leido && !tieneTexto && !lectura.tieneImagen) {
    return {
      error: 'El PDF está en blanco: no tiene texto ni imagen. Revisa que sea el archivo correcto.'
    };
  }
  if (tieneTexto) {
    // Se puede leer: se revisa el CONTENIDO (el nombre del archivo da igual)
    if (reglas.palabras && !reglas.palabras.some(p => texto.includes(p))) {
      return {
        error: `Este archivo no parece ser "${doc.nombre}". Revisa que estés subiendo el documento correcto.`
      };
    }
    const otro = pareceOtroDocumento(texto, doc);
    if (otro) {
      return {
        error: `Este archivo parece ser "${otro.nombre}", no "${doc.nombre}". Revisa que lo estés subiendo en el lugar correcto.`
      };
    }
  } else if (!nombreIdentificaDocumento(archivo.name, reglas.nombreArchivo)) {
    // No se puede leer (escaneado o con clave): el nombre del archivo es la única pista
    const motivo = lectura.protegido ? 'tiene contraseña' : 'es escaneado (una foto del documento)';
    return {
      error: `Este PDF ${motivo}, así que no podemos leer qué documento es. Cámbiale el nombre para que lo diga, por ejemplo: "${reglas.ejemploNombre}".`
    };
  }
  return {
    item: {
      nombre: archivo.name,
      tamano: archivo.size,
      blob: archivo,
      fecha: Date.now(),
      huella,
      paginas: lectura.paginas,
      revisado: tieneTexto,
      // true = se leyó y pasó la revisión automática
      // ¿El texto trae el número de documento del candidato? (los certificados de EPS y pensión lo traen)
      // Solo se mira en los documentos que siempre lo traen (revision.traeCedula)
      mencionaCedula: tieneTexto && reglas.traeCedula ? texto.replace(/^\d+$/.test(cedula) ? /[^0-9]/g : /[^A-Z0-9]/g, '').includes(cedula) : null,
      protegido: !!lectura.protegido,
      // true = tiene contraseña que no es la cédula, no se pudo revisar
      claveEsCedula: !!lectura.claveEsCedula // true = tenía contraseña y era la cédula (se revisó igual)
    }
  };
}

/* ---------------------------------------------------------------------------
   2.4 REVISIÓN DE LA FOTO 3×4 (único documento que se sube como imagen)
   Flujo: revisarImagen() → (esJpgOPng, abrirImagen, analizarFondo) → comprimirImagen()
   --------------------------------------------------------------------------- */

/** ¿Es una imagen JPG o PNG de verdad? Se mira la "firma" de los primeros bytes. */
async function esJpgOPng(archivo) {
  const b = new Uint8Array(await archivo.slice(0, 4).arrayBuffer());
  const esJpg = b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF;
  const esPng = b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47;
  return esJpg || esPng;
}

/** Abre una imagen para poder medirla y dibujarla. Respeta la rotación de las fotos del celular. */
async function abrirImagen(archivo) {
  if (window.createImageBitmap) {
    try {
      return await createImageBitmap(archivo, {
        imageOrientation: 'from-image'
      });
    } catch {/* sigue abajo */}
  }
  return new Promise((resolver, rechazar) => {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolver(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      rechazar(new Error('imagen ilegible'));
    };
    img.src = url;
  });
}

/**
 * Achica la imagen (lado más largo = maximo px) y la guarda como JPG.
 * Una foto de celular de 4 MB queda en unos 200–400 KB.
 */
function comprimirImagen(imagen, maximo, calidad, fondo) {
  const escala = Math.min(1, maximo / Math.max(imagen.width, imagen.height));
  const lienzo = document.createElement('canvas');
  lienzo.width = Math.round(imagen.width * escala);
  lienzo.height = Math.round(imagen.height * escala);
  const ctx = lienzo.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; // por si la imagen PNG trae partes transparentes
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  ctx.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
  if (fondo) aclararFondo(ctx, lienzo.width, lienzo.height, fondo);
  return new Promise(resolver => lienzo.toBlob(blob => resolver({
    blob,
    ancho: lienzo.width,
    alto: lienzo.height
  }), 'image/jpeg', calidad));
}

/**
 * Mira el fondo de la foto: una franja delgada en los bordes (laterales y arriba; abajo
 * suele ir la ropa). Devuelve su color promedio, qué tan claro es y qué tanto color tiene.
 */
function analizarFondo(imagen) {
  const lienzo = document.createElement('canvas');
  lienzo.width = 60;
  lienzo.height = 80;
  const ctx = lienzo.getContext('2d');
  ctx.drawImage(imagen, 0, 0, 60, 80);
  const {
    data
  } = ctx.getImageData(0, 0, 60, 80);
  let r = 0,
    g = 0,
    b = 0,
    cuenta = 0;
  for (let y = 0; y < 80; y++) {
    for (let x = 0; x < 60; x++) {
      if (!(x < 4 || x >= 56 || y < 4)) continue;
      const i = (y * 60 + x) * 4;
      r += data[i];
      g += data[i + 1];
      b += data[i + 2];
      cuenta++;
    }
  }
  r /= cuenta;
  g /= cuenta;
  b /= cuenta;
  const maximo = Math.max(r, g, b);
  return {
    r,
    g,
    b,
    brillo: (r + g + b) / 3,
    // 0 = negro, 255 = blanco
    color: maximo > 0 ? (maximo - Math.min(r, g, b)) / maximo : 0 // 0 = gris/blanco, 1 = color puro
  };
}

/**
 * Aclara la foto para que el fondo quede blanco: si la pared salió gris (poca luz)
 * o amarillenta (bombillo cálido), sube cada color lo justo para que el fondo quede
 * casi blanco. Trabaja sobre el lienzo ya achicado.
 */
function aclararFondo(ctx, ancho, alto, fondo) {
  const objetivo = 245;
  const ganancia = c => Math.min(2.2, Math.max(1, objetivo / Math.max(c, 1)));
  const gr = ganancia(fondo.r),
    gg = ganancia(fondo.g),
    gb = ganancia(fondo.b);
  if (gr < 1.03 && gg < 1.03 && gb < 1.03) return; // ya está bien
  const datos = ctx.getImageData(0, 0, ancho, alto);
  const d = datos.data;
  for (let i = 0; i < d.length; i += 4) {
    d[i] = Math.min(255, d[i] * gr);
    d[i + 1] = Math.min(255, d[i + 1] * gg);
    d[i + 2] = Math.min(255, d[i + 2] * gb);
  }
  ctx.putImageData(datos, 0, 0);
}

/**
 * Revisa la foto 3×4 (se sube como imagen, no como PDF):
 * JPG o PNG real, no repetida, tamaño mínimo, vertical y con fondo claro.
 * Si pasa, la entrega comprimida en JPG.
 */
async function revisarImagen(archivo, doc, archivosActuales) {
  if (!archivo || archivo.size === 0) return {
    error: 'El archivo está vacío. Vuelve a elegir la foto.'
  };
  if (archivo.size > CONFIG.tamanoMaximoMB * 4 * 1024 * 1024) {
    return {
      error: `La foto pesa ${pesoLegible(archivo.size)}. Elige una más liviana.`
    };
  }
  if (!(await esJpgOPng(archivo))) {
    return {
      error: 'La foto debe ser una imagen JPG o PNG (no PDF ni otro formato).'
    };
  }
  const huella = await huellaDelArchivo(archivo);
  for (const otro of CONFIG.documentos) {
    if ((archivosActuales[otro.id] || []).some(item => item.huella === huella)) {
      return {
        error: otro.id === doc.id ? 'Ya subiste esta misma foto.' : `Esta misma imagen ya la usaste en "${otro.nombre}".`
      };
    }
  }
  let imagen;
  try {
    imagen = await abrirImagen(archivo);
  } catch {
    return {
      error: 'No pudimos abrir la imagen. Tómala de nuevo o elige otra.'
    };
  }
  const {
    anchoMinimo,
    altoMinimo
  } = CONFIG.foto;
  if (imagen.width < anchoMinimo || imagen.height < altoMinimo) {
    return {
      error: `La foto es muy pequeña (${imagen.width}×${imagen.height}). Debe medir al menos ${anchoMinimo}×${altoMinimo} píxeles.`
    };
  }
  if (imagen.width > imagen.height) {
    return {
      error: 'La foto debe ser vertical (más alta que ancha), como una foto tipo documento.'
    };
  }
  const fondo = analizarFondo(imagen);
  if (fondo.color > CONFIG.foto.colorMaximoFondo) {
    return {
      error: 'El fondo de la foto tiene color. Debe ser blanco: tómala frente a una pared blanca.'
    };
  }
  if (fondo.brillo < CONFIG.foto.brilloMinimoFondo) {
    return {
      error: 'La foto está muy oscura. Tómala de día cerca de una ventana o con la luz encendida, frente a una pared blanca.'
    };
  }

  // Si el fondo salió gris o amarillento por la luz, se aclara solo para que quede blanco
  const {
    blob
  } = await comprimirImagen(imagen, 1200, 0.88, fondo);
  return {
    item: {
      nombre: archivo.name,
      tamano: blob.size,
      blob,
      fecha: Date.now(),
      huella,
      extension: 'jpg',
      revisado: true
    }
  };
}

/* ---------------------------------------------------------------------------
   2.5 ARMADO DEL ZIP Y DESCARGAS
   Nombres estándar, datos_candidato.json, 00_LEEME_REVISION.txt y descarga.
   --------------------------------------------------------------------------- */

/**
 * Nombre estándar de cada archivo dentro del ZIP:
 *   1144123456_02_CEDULA.pdf
 *   1144123456_03_DIPLOMAS_2.pdf   (cuando hay varios)
 *   1144123456_01_FOTO.jpg         (la foto va como imagen)
 */
function nombreArchivoEnZip(cedula, doc, item, indice, total) {
  const sufijo = total > 1 ? `_${indice + 1}` : '';
  const extension = item.extension || 'pdf';
  return `${cedula}_${doc.codigo}_${textoParaArchivo(doc.id)}${sufijo}.${extension}`;
}

/** Nombre del ZIP: 1144123456_MARIA_JOSE_PENA_AUXILIAR_DE_FRUVER.zip */
function nombreDelZip(datos) {
  return `${datos.cedula}_${textoParaArchivo(datos.nombre, 40)}_${textoParaArchivo(datos.cargo, 30)}.zip`;
}

/**
 * Arma el ZIP con los archivos renombrados y un archivo "datos_candidato.json".
 * Ese JSON lo usará el panel de Gestión Humana para reconocer al candidato
 * por su cédula.
 */
async function armarZip(sesion) {
  const zip = new JSZip();
  const {
    datos,
    archivos
  } = sesion;
  const listado = [];
  const resumen = []; // para el archivo de texto 00_LEEME_REVISION.txt

  documentosQueAplican(datos).forEach(doc => {
    const lista = archivos[doc.id] || [];
    lista.forEach((item, i) => {
      const nombre = nombreArchivoEnZip(datos.cedula, doc, item, i, lista.length);
      zip.file(nombre, item.blob);
      // revisado/protegido le dicen a Gestión Humana qué archivos debe mirar con más cuidado
      listado.push({
        documento: doc.id,
        archivo: nombre,
        nombreOriginal: item.nombre,
        revisadoAutomaticamente: !!item.revisado,
        conContrasena: !!item.protegido || !!item.claveEsCedula,
        contrasenaEsCedula: !!item.claveEsCedula,
        traeNumeroDocumento: item.mencionaCedula === undefined ? null : item.mencionaCedula
      });
      resumen.push({
        doc,
        nombre,
        item
      });
    });
  });
  zip.file('datos_candidato.json', JSON.stringify({
    version: 1,
    tipoDocumento: datos.tipoDocumento || 'CC',
    cedula: datos.cedula,
    nombre: datos.nombre,
    celular: datos.celular || '',
    correo: datos.correo || '',
    cargo: datos.cargo,
    seccion: datos.seccion,
    primerEmpleo: !!datos.primerEmpleo,
    autorizacionDatos: sesion.autorizacion,
    generado: new Date().toISOString(),
    archivos: listado
  }, null, 2));
  zip.file('00_LEEME_REVISION.txt', textoDeRevision(sesion, resumen));

  // Los PDF ya vienen comprimidos; "STORE" evita gastar tiempo y batería del celular.
  return zip.generateAsync({
    type: 'blob',
    compression: 'STORE'
  });
}

/**
 * Resumen en texto para Gestión Humana: qué revisó la página en cada archivo y cuáles
 * hay que mirar a mano. Va dentro del ZIP como 00_LEEME_REVISION.txt.
 */
function textoDeRevision(sesion, resumen) {
  const {
    datos
  } = sesion;
  const lineas = ['DOCUMENTOS DE INGRESO — Supertiendas Cañaveral S.A.S.', '', `Nombre:        ${datos.nombre}`, `Documento:     ${datos.tipoDocumento || 'CC'} ${datos.cedula}`, `Celular:       ${datos.celular || '—'}`, `Correo:        ${datos.correo || '—'}`, `Cargo:         ${datos.cargo}`, `Sección:       ${datos.seccion}`, `Primer empleo: ${datos.primerEmpleo ? 'Sí' : 'No'}`, `Generado:      ${new Date().toLocaleString('es-CO')}`, '', 'REVISIÓN DE CADA ARCHIVO', '------------------------'];
  let porRevisar = 0;
  resumen.forEach(_ref3 => {
    let {
      doc,
      nombre,
      item
    } = _ref3;
    let estado;
    if (doc.tipo === 'imagen') estado = 'OK — foto revisada (tamaño, vertical y fondo claro).';else if (item.protegido) {
      estado = 'REVISAR A MANO — tiene contraseña y no se pudo leer.';
      porRevisar++;
    } else if (!item.revisado) {
      estado = 'REVISAR A MANO — es escaneado (imagen), no se pudo leer el texto.';
      porRevisar++;
    } else {
      estado = 'OK — el contenido corresponde al documento.';
      if (item.mencionaCedula === false) {
        estado += ' OJO: no trae el número de documento del candidato, confirmar que sea suyo.';
        porRevisar++;
      }
    }
    lineas.push(`${nombre}`, `   ${doc.nombre} (archivo original: ${item.nombre})`, `   ${estado}`, '');
  });
  lineas.push(porRevisar === 0 ? 'No hay archivos marcados para revisar a mano.' : `Archivos para revisar a mano: ${porRevisar}.`, '', 'LO QUE LA PÁGINA NO REVISA (siempre a mano):', '- Que los certificados estén vigentes y firmados.', '- Que la foto sea realmente de la persona.', '- La revisión automática busca palabras clave: un documento con un formato muy raro', '  podría pasar sin ser el correcto. Dale una mirada rápida a cada archivo.');
  return lineas.join('\r\n'); // \r\n para que se vea bien en el Bloc de notas de Windows
}

/** Descarga un archivo al dispositivo del candidato. */
function descargarArchivo(blob, nombre) {

}

}

/* ============================================================================
   4. LIMPIEZA POR INACTIVIDAD (solo dispositivos prestados o públicos)
   ----------------------------------------------------------------------------
   Si nadie toca la página en X minutos, se borra todo. Un minuto antes avisa.
   ============================================================================ */
function useInactividad(activo, minutos, alVencer) {
  const [segundosRestantes, setSegundosRestantes] = useState(null);
  const ultimaActividad = useRef(Date.now());
  const alVencerRef = useRef(alVencer);
  alVencerRef.current = alVencer; // siempre la versión más reciente

  useEffect(() => {
    if (!activo) {
      setSegundosRestantes(null);
      return;
    }
    ultimaActividad.current = Date.now();

    // Cualquier toque, tecla o scroll reinicia el conteo y esconde el aviso
    const marcarActividad = () => {
      ultimaActividad.current = Date.now();
      setSegundosRestantes(null);
    };
    const eventos = ['pointerdown', 'keydown', 'scroll'];
    eventos.forEach(e => window.addEventListener(e, marcarActividad, {
      passive: true
    }));
    const reloj = setInterval(() => {
      const restanteMs = minutos * 60 * 1000 - (Date.now() - ultimaActividad.current);
      if (restanteMs <= 0) {
        ultimaActividad.current = Date.now();
        alVencerRef.current();
      } else if (restanteMs <= 60 * 1000) {
        setSegundosRestantes(Math.ceil(restanteMs / 1000));
      }
    }, 1000);
    return () => {
      eventos.forEach(e => window.removeEventListener(e, marcarActividad));
      clearInterval(reloj);
