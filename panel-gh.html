/* ---------- Ficha del candidato: revisar documentos y completar el checklist ---------- */

/** Revisa que el archivo que sube GH sea PDF, JPG o PNG de verdad (por sus primeros bytes). */
async function tipoDeArchivo(archivo) {
  const b = new Uint8Array(await archivo.slice(0, 8).arrayBuffer());
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'pdf';
  if (b[0] === 0xFF && b[1] === 0xD8) return 'jpg';
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'png';
  return null;
}


function Ficha({ c, usuario, avisar, onCambio, onCerrar, onNoContratado }) {
  // onNoContratado: lo llama el selector de estado al elegir "No contratado" (App pide confirmar y borra)
  const [exp, setExp] = useState(c.expediente);
  const [archivosCandidato, setArchivosCandidato] = useState({});  // nombre → handle
  const [archivosGH, setArchivosGH] = useState({});                // nombre → handle
  const [guardando, setGuardando] = useState(false);
  const [rechazando, setRechazando] = useState(null);              // { id, motivo } mientras escribe el motivo
  const [pidiendo, setPidiendo] = useState(false);                 // hoja "Pedir correcciones" abierta
  const [descargando, setDescargando] = useState(false);           // armando el ZIP del expediente
  const campoArchivo = useRef(null);
  const destino = useRef(null);                                    // a qué ítem va el archivo que se está subiendo

  /** Lee qué archivos hay en la carpeta del candidato y en su subcarpeta de GH. */
  const leerArchivos = useCallback(async () => {
    const enCarpeta = await listar(c.carpeta);
    setArchivosCandidato(Object.fromEntries(enCarpeta.filter((x) => x.tipo === 'file').map((x) => [x.nombre, x.handle])));
    const gh = enCarpeta.find((x) => x.tipo === 'directory' && x.nombre === C.gestionHumana);
    setArchivosGH(gh ? Object.fromEntries((await listar(gh.handle)).filter((x) => x.tipo === 'file').map((x) => [x.nombre, x.handle])) : {});
  }, [c]);

  useEffect(() => {
    leerArchivos();
    const alTeclear = (ev) => ev.key === 'Escape' && !rechazando && !pidiendo && onCerrar();
    window.addEventListener('keydown', alTeclear);
    return () => window.removeEventListener('keydown', alTeclear);
  }, [c, rechazando, pidiendo]);

  /**
   * Hace un cambio en el expediente y lo guarda en la carpeta.
   * - modificar(copia): función que cambia la copia del expediente.
   * - accion: texto para la bitácora.
   * - avanzarEstado: si el candidato está en "Recibido", pasa a "En revisión".
   */
  async function cambiar(modificar, accion, avanzarEstado = true) {
    if (guardando) return false;
    setGuardando(true);
    try {
      const copia = JSON.parse(JSON.stringify(exp));
      copia.documentos = copia.documentos || {};
      copia.gestionHumana = copia.gestionHumana || {};
      modificar(copia);
      if (avanzarEstado && copia.estado === 'recibido') copia.estado = 'revision';
      anotar(copia, usuario, accion);
      setExp(await guardarExpediente(c.carpeta, copia));
      onCambio();
      return true;
    } catch (e) {
      console.error(e);
      if (e instanceof ErrorChoque) {
        avisar(e.message, 'error');
        try { setExp(await leerExpediente(c.carpeta)); } catch (x) { /* se queda con lo que tenía */ }
      } else avisar(`No se pudo guardar: ${e.message}`, 'error');
      return false;
    } finally { setGuardando(false); }
  }

  /* ----- Documentos del candidato ----- */
  function revisar(id, revision, motivo = '') {
    const doc = nombreDocumento(id);
    const texto = revision === 'aprobado' ? `Aprobó ${doc}` : revision === 'rechazado' ? `Rechazó ${doc}: ${motivo}` : `Dejó ${doc} sin revisar`;
    cambiar((e) => { e.documentos[id].revision = revision; e.documentos[id].motivo = motivo; }, texto)
      .then((ok) => ok && setRechazando(null));
  }

  /* ----- Archivos de Gestión Humana ----- */
  function elegirArchivo(itemId) { destino.current = itemId; campoArchivo.current.click(); }

  /** Pasa los archivos actuales de un ítem a _anteriores (para reemplazar o quitar sin perder nada). */
  async function guardarAnteriores(nombres) {
    if (!nombres.length) return;
    const carpetaGH = await subcarpeta(c.carpeta, C.gestionHumana);
    const anteriores = await subcarpeta(await subcarpeta(c.carpeta, C.anteriores), marcaDeTiempo());
    for (const n of nombres) {
      if (archivosGH[n]) await moverArchivo(archivosGH[n], carpetaGH, anteriores);
    }
  }

  async function subirArchivo(archivo) {
    const itemId = destino.current;
    const item = ITEMS_GH[itemId];
    if (!archivo || !item) return;
    const tipo = await tipoDeArchivo(archivo);
    if (!tipo) { avisar(`"${archivo.name}" no es PDF ni imagen JPG/PNG`, 'error'); return; }
    if (archivo.size > CONFIG.tamanoMaximoGHMB * 1024 * 1024) { avisar(`Pesa ${tamanoLegible(archivo.size)}; el máximo es ${CONFIG.tamanoMaximoGHMB} MB`, 'error'); return; }
    setGuardando(true);
    try {
      const anteriores = ((exp.gestionHumana || {})[itemId] || {}).archivos || [];
      await guardarAnteriores(anteriores);
      const nombre = `${exp.cedula}_GH_${textoParaArchivo(itemId)}.${tipo}`;
      await escribir(await subcarpeta(c.carpeta, C.gestionHumana), nombre, archivo);
    } catch (e) {
      avisar(`No se pudo subir: ${e.message}`, 'error'); setGuardando(false); return;
    }
    setGuardando(false);
    const nombre = `${exp.cedula}_GH_${textoParaArchivo(itemId)}.${tipo}`;
    const reemplazo = (((exp.gestionHumana || {})[itemId] || {}).archivos || []).length > 0;
    const ok = await cambiar((e) => {
      e.gestionHumana[itemId] = { ...(e.gestionHumana[itemId] || {}), archivos: [nombre], fecha: new Date().toISOString(), por: usuario };
    }, `${reemplazo ? 'Reemplazó' : 'Subió'} ${item.nombre}`);
    if (ok) { await leerArchivos(); avisar(`${item.nombre}: guardado en la carpeta del candidato`); }
  }

  async function quitarArchivo(itemId) {
    const item = ITEMS_GH[itemId];
    setGuardando(true);
    try { await guardarAnteriores(((exp.gestionHumana || {})[itemId] || {}).archivos || []); }
    catch (e) { avisar(`No se pudo quitar: ${e.message}`, 'error'); setGuardando(false); return; }
    setGuardando(false);
    if (await cambiar((e) => { e.gestionHumana[itemId] = { ...(e.gestionHumana[itemId] || {}), archivos: [] }; }, `Quitó ${item.nombre} (quedó en ${C.anteriores})`)) leerArchivos();
  }

  function marcar(itemId, campo, valor, texto) {
    cambiar((e) => { e.gestionHumana[itemId] = { ...(e.gestionHumana[itemId] || {}), [campo]: valor, fecha: new Date().toISOString(), por: usuario }; }, texto);
  }

  function cambiarModoInduccion(modo) {
    cambiar((e) => { e.gestionHumana._induccion = { modo }; }, `Paquete de inducción: ${modo === 'unico' ? 'un solo PDF' : 'archivos separados'}`);
  }

  function cambiarEstado(estado) {
    cambiar((e) => { e.estado = estado; }, `Cambió el estado a "${nombreEstado(estado)}"`, false)
      .then((ok) => ok && ESTADOS_LISTOS.includes(estado) && !ESTADOS_LISTOS.includes(exp.estado)
        && avisar(`${nombreBonito(exp.nombre)} pasó a Listos`));
  }

  /**
   * Arma y descarga UN solo ZIP con todo el candidato:
   *   1_Documentos_del_candidato/  los archivos actuales de cada documento (no los de _anteriores)
   *   2_Gestion_Humana/            lo que subió Gestión Humana
   *   00_RESUMEN.txt               estado de cada documento y del checklist, para leerlo rápido
   *   expediente.json              el expediente completo
   * No cambia nada en la carpeta; solo anota en la bitácora que se descargó.
   */
  async function descargarZip() {
    setDescargando(true);
    try {
      const zip = new JSZip();
      for (const [, doc] of docsOrdenados) {
        for (const n of doc.archivos) {
          if (archivosCandidato[n]) zip.file(`1_Documentos_del_candidato/${n}`, await archivosCandidato[n].getFile());
        }
      }
      for (const [n, handle] of Object.entries(archivosGH)) zip.file(`2_Gestion_Humana/${n}`, await handle.getFile());
      zip.file('00_RESUMEN.txt', resumenDelCandidato(exp));
      zip.file('expediente.json', JSON.stringify(exp, null, 2));
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = `${exp.cedula}_${textoParaArchivo(exp.nombre, 40)}_EXPEDIENTE.zip`;
      document.body.appendChild(enlace); enlace.click(); enlace.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60 * 1000);
      await cambiar(() => {}, 'Descargó el expediente completo en ZIP', false);
    } catch (e) {
      avisar(`No se pudo armar el ZIP: ${e.message}`, 'error');
    } finally { setDescargando(false); }
  }

  /** Registra en el expediente la corrección pedida (la llama la hoja "Pedir correcciones"). */
  function registrarCorreccion(correccion) {
    const lista = correccion.documentos.map((x) => nombreDocumento(x.id)).join(', ');
    return cambiar((e) => {
      e.correcciones = [...(e.correcciones || []), correccion];
      e.estado = 'correcciones';
    }, `Pidió la corrección ${correccion.n}: ${lista}`, false);
  }

  /* ----- Piezas de la ficha ----- */
  const gh = (exp && exp.gestionHumana) || {};
  const modoInduccion = (gh._induccion || {}).modo || 'unico';
  const av = avanceDe(exp);

  /** "Abrir página ↗": la plataforma del ítem (si en Ajustes le pusieron página), en otra pestaña. */
  const EnlacePagina = ({ itemId, clase = 'enlace-pagina' }) => {
    const enlace = (ITEMS_GH[itemId] || {}).enlace;
    if (!enlace) return null;
    return <a className={clase} href={enlace} target="_blank" rel="noopener noreferrer"
              title={enlace} onClick={(e) => e.stopPropagation()}>Abrir página ↗</a>;
  };

  /** Fila de un ítem con archivo: nombre, estado, y botones Abrir página / Ver / Quitar / Subir. */
  const FilaArchivo = ({ itemId, titulo, pista, children }) => {
    const archivos = (gh[itemId] || {}).archivos || [];
    const tiene = archivos.length > 0;
    return (
      <div className="item-ficha">
        <span className={`punto ${tiene ? 'hecho' : ''}`} aria-hidden="true">{tiene && <Icono nombre="listo" tamano={13} />}</span>
        <div className="fila-texto">
          <span className="item-titulo">{titulo || ITEMS_GH[itemId].nombre}</span>
          <span className="nombre-archivo">{tiene ? `${archivos[0]} — ${(gh[itemId].por || '')}, ${fechaCorta(gh[itemId].fecha)}` : (pista || 'Falta subir el archivo')}</span>
          {children}
        </div>
        <div className="item-botones">
          <EnlacePagina itemId={itemId} clase="boton boton-texto" />
          {tiene && <button className="boton boton-texto" disabled={!archivosGH[archivos[0]]} onClick={() => abrirArchivo(archivosGH[archivos[0]])}>Ver</button>}
          {tiene && <button className="boton boton-texto" disabled={guardando} onClick={() => quitarArchivo(itemId)}>Quitar</button>}
          <button className={`boton ${tiene ? 'boton-secundario' : 'boton-suave'}`} disabled={guardando} onClick={() => elegirArchivo(itemId)}>
            <Icono nombre="subir" tamano={16} /> {tiene ? 'Cambiar' : 'Subir'}
          </button>
        </div>
      </div>
    );
  };

  /** Casilla de chequeo (hecho / no hecho). */
  // conEnlace=false cuando la casilla va dentro de una FilaArchivo (que ya muestra "Abrir página")
  const Casilla = ({ itemId, texto, conEnlace = true }) => {
    const hecho = !!(gh[itemId] || {}).hecho;
    return (
      <label className="casilla">
        <span>{texto || ITEMS_GH[itemId].nombre}{conEnlace && <EnlacePagina itemId={itemId} />}
          {hecho && gh[itemId].por && <small>{gh[itemId].por}, {fechaCorta(gh[itemId].fecha)}</small>}</span>
        {/* Interruptor de iOS (es una casilla de chequeo con otro aspecto) */}
        <input type="checkbox" role="switch" className="interruptor" checked={hecho} disabled={guardando}
               onChange={() => marcar(itemId, 'hecho', !hecho, `${hecho ? 'Desmarcó' : 'Marcó'} "${texto || ITEMS_GH[itemId].nombre}"`)} />
      </label>
    );
  };

  if (!exp) {
    return (
      <>
        <div className="velo" onClick={onCerrar} />
        <aside className="detalle" role="dialog" aria-modal="true" aria-label="Candidato">
          <div className="agarre" aria-hidden="true" />
          <div className="detalle-cabeza"><h2>{nombreBonito(c.nombre)}</h2></div>
          <div className="detalle-cuerpo"><div className="alerta error">{c.problema} Revisa la carpeta “{c.nombreCarpeta}” en OneDrive.</div>
            <button className="boton boton-secundario" onClick={onCerrar}>Cerrar</button></div>
        </aside>
      </>
    );
  }

  const docsOrdenados = Object.entries(exp.documentos || {})
    .sort(([a], [b]) => CONFIG.documentos.findIndex((d) => d.id === a) - CONFIG.documentos.findIndex((d) => d.id === b));
  const cerrado = exp.estado === 'contratado' || exp.estado === 'no_contratado';
  const todoListo = av.total > 0 && av.hechos === av.total;
  // Para "Pedir correcciones": documentos rechazados y documentos que no mandó
  const rechazados = docsOrdenados.filter(([, doc]) => doc.revision === 'rechazado').map(([id, doc]) => ({ id, motivo: doc.motivo || 'No se acepta' }));
  const faltantes = CONFIG.documentos.filter((d) => !(exp.documentos || {})[d.id]).map((d) => d.id);

  return (
    <>
      <div className="velo" onClick={onCerrar} />
      <aside className="detalle ficha" role="dialog" aria-modal="true" aria-label={`Ficha de ${exp.nombre}`}>
        <input ref={campoArchivo} type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" hidden
               onChange={(e) => { subirArchivo(e.target.files[0]); e.target.value = ''; }} />

        {/* Cabeza: nombre, estado y avance (barra de título de la hoja de iOS) */}
        <div className="agarre" aria-hidden="true" />
        <div className="detalle-cabeza">
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, alignItems: 'flex-start' }}>
            <div className="fila-texto">
              <h2 style={{ overflowWrap: 'anywhere' }}>{nombreBonito(exp.nombre)}</h2>
              <span className="fila-sub numeros">{siglaDocumento(exp.tipoDocumento)} {exp.cedula} — {exp.cargo || 'sin cargo'}{exp.seccion ? `, ${exp.seccion}` : ''}{exp.primerEmpleo ? ' — primer empleo' : ''}</span>
              {(exp.celular || exp.correo) && (
                <span className="contacto">
                  {exp.celular && <a className="numeros" href={`tel:+57${exp.celular}`}>Cel. {exp.celular}</a>}
                  {exp.correo && <a href={`mailto:${exp.correo}`}>{exp.correo}</a>}
                </span>
              )}
            </div>
            <div className="acciones">
              <button className="boton boton-secundario" disabled={descargando || guardando} onClick={descargarZip}>
                <Icono nombre={descargando ? 'cargando' : 'paquete'} tamano={16} /> {descargando ? 'Armando…' : 'Descargar ZIP'}
              </button>
              <button className="boton boton-texto" style={{ fontWeight: 600, fontSize: 17 }} onClick={onCerrar}>Listo</button>
            </div>
          </div>
          <div className="cabeza-estado">
            <select className={`selector selector-estado e-${exp.estado}`} value={exp.estado} disabled={guardando}
                    onChange={(e) => e.target.value === 'no_contratado' ? onNoContratado(c) : cambiarEstado(e.target.value)}
                    aria-label="Estado del candidato">
              {CONFIG.estados.map((e) => <option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="cana cana-ancha" aria-hidden="true">{av.nudos.map((n, i) => <span key={i} className={`nudo ${n}`} />)}</div>
              <div className="avance-texto">{av.hechos} de {av.total} listos{guardando ? ' — guardando…' : ''}</div>
            </div>
            <button className="boton boton-secundario" disabled={guardando || (!rechazados.length && !faltantes.length)}
                    title={!rechazados.length && !faltantes.length ? 'No hay documentos rechazados ni faltantes' : undefined}
                    onClick={() => setPidiendo(true)}>
              <Icono nombre="corregir" tamano={16} /> Pedir correcciones
            </button>
          </div>
          {todoListo && !cerrado && exp.estado !== 'completo' && (
            <div className="mensaje info listo-banner">
              Todo está completo.
              <button className="boton boton-principal" onClick={() => cambiarEstado('completo')}>Marcar como Completo</button>
            </div>
          )}
        </div>

        <div className="detalle-cuerpo">
          {/* 1. Documentos que mandó el candidato */}
          <section>
            <h3>Documentos del candidato</h3>
            <p className="nota-seccion">Ábrelos con Ver y marca cada uno. Lo rechazado se le pide corregir con “Pedir correcciones”, arriba.</p>
            <div className="tarjeta">
              {docsOrdenados.map(([id, doc]) => (
                <div key={id} className="item-ficha">
                  <span className={`punto ${doc.revision === 'aprobado' ? 'hecho' : doc.revision === 'rechazado' ? 'malo' : ''}`} aria-hidden="true">
                    {doc.revision === 'aprobado' && <Icono nombre="listo" tamano={13} />}{doc.revision === 'rechazado' && <Icono nombre="cerrar" tamano={12} />}
                  </span>
                  <div className="fila-texto">
                    <span className="item-titulo">{nombreDocumento(id)}</span>
                    <span className="nombre-archivo">
                      {doc.archivos.map((n, i) => (
                        <button key={n} className="enlace-archivo" disabled={!archivosCandidato[n]} onClick={() => abrirArchivo(archivosCandidato[n])}>
                          Ver{doc.archivos.length > 1 ? ` ${i + 1}` : ''}
                        </button>
                      ))}
                      {doc.conContrasena ? ' — tiene contraseña' : ''}{!doc.revisadoAutomaticamente ? ' — revísalo con cuidado' : ''}
                      {doc.correccion ? ` — llegó en la corrección ${doc.correccion}` : ''}
                    </span>
                    {doc.revision === 'rechazado' && doc.motivo && <span className="motivo-texto">Motivo: {doc.motivo}</span>}
                    {rechazando && rechazando.id === id && (
                      <div className="caja-motivo">
                        <div className="chips">
                          {CONFIG.motivosRapidos.map((m) => <button key={m} className="chip" onClick={() => setRechazando({ id, motivo: m })}>{m}</button>)}
                        </div>
                        <input autoFocus value={rechazando.motivo} maxLength={160} placeholder="¿Por qué se rechaza? El candidato lo verá"
                               onChange={(e) => setRechazando({ id, motivo: e.target.value })}
                               onKeyDown={(e) => { if (e.key === 'Enter' && rechazando.motivo.trim()) revisar(id, 'rechazado', rechazando.motivo.trim()); if (e.key === 'Escape') setRechazando(null); }} />
                        <div className="acciones">
                          <button className="boton boton-secundario" onClick={() => setRechazando(null)}>Cancelar</button>
                          <button className="boton boton-principal" disabled={!rechazando.motivo.trim() || guardando} onClick={() => revisar(id, 'rechazado', rechazando.motivo.trim())}>Rechazar</button>
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="segmento" role="group" aria-label={`Revisión de ${nombreDocumento(id)}`}>
                    <button aria-pressed={doc.revision === 'aprobado'} disabled={guardando}
                            onClick={() => revisar(id, doc.revision === 'aprobado' ? 'pendiente' : 'aprobado')}>Aprobar</button>
                    <button aria-pressed={doc.revision === 'rechazado'} className="rechazar" disabled={guardando}
                            onClick={() => doc.revision === 'rechazado' ? revisar(id, 'pendiente') : setRechazando({ id, motivo: '' })}>Rechazar</button>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* 2. Archivos que sube Gestión Humana */}
          <section>
            <h3>Documentos de Gestión Humana</h3>
            <p className="nota-seccion">Descárgalos de cada plataforma y súbelos aquí. Quedan en la carpeta del candidato, en “{C.gestionHumana}”.</p>
            <div className="tarjeta">
              {CONFIG.checklistGH.filter((i) => i.tipo === 'archivo').map((i) => <FilaArchivo key={i.id} itemId={i.id} />)}
              {exp.primerEmpleo ? (
                <FilaArchivo itemId="pension" pista="Primer empleo: sube la afiliación al fondo de pensión" />
              ) : (
                <FilaArchivo itemId="pension" titulo="Pensión" pista="Ya trabajó antes: marca si ya está afiliado (subir el certificado es opcional)">
                  <Casilla itemId="pension" texto="Ya está afiliado a un fondo de pensión" conEnlace={false} />
                </FilaArchivo>
              )}
            </div>
          </section>

          {/* 3. Paquete de inducción */}
          <section>
            <h3>Paquete de inducción</h3>
            <div className="segmento segmento-ancho" role="group" aria-label="Cómo llegó el paquete de inducción">
              <button aria-pressed={modoInduccion === 'unico'} disabled={guardando} onClick={() => modoInduccion !== 'unico' && cambiarModoInduccion('unico')}>Un solo PDF</button>
              <button aria-pressed={modoInduccion === 'separado'} disabled={guardando} onClick={() => modoInduccion !== 'separado' && cambiarModoInduccion('separado')}>Archivos separados</button>
            </div>
            <div className="tarjeta" style={{ marginTop: 10 }}>
              {modoInduccion === 'unico' ? (
                <FilaArchivo itemId="paquete_induccion">
                  <div className="casillas">
                    {CONFIG.checklistGH.filter((i) => i.tipo === 'induccion').map((i) => <Casilla key={i.id} itemId={i.id} texto={`${i.nombre}: revisado`} />)}
                  </div>
                </FilaArchivo>
              ) : CONFIG.checklistGH.filter((i) => i.tipo === 'induccion').map((i) => (
                <FilaArchivo key={i.id} itemId={i.id}><Casilla itemId={i.id} texto="Revisado" conEnlace={false} /></FilaArchivo>
              ))}
            </div>
          </section>

          {/* 4. Chequeos */}
          <section>
            <h3>Chequeos</h3>
            <div className="tarjeta">
              {CONFIG.checklistGH.filter((i) => i.tipo === 'apto').map((i) => {
                const valor = (gh[i.id] || {}).valor || '';
                return (
                  <div key={i.id} className="item-ficha">
                    <span className={`punto ${valor === 'apto' ? 'hecho' : valor === 'no_apto' ? 'malo' : ''}`} aria-hidden="true">{valor === 'apto' && <Icono nombre="listo" tamano={13} />}</span>
                    <div className="fila-texto"><span className="item-titulo">{i.nombre} <EnlacePagina itemId={i.id} /></span>
                      {valor && <span className="nombre-archivo">{gh[i.id].por}, {fechaCorta(gh[i.id].fecha)}</span>}</div>
                    <div className="segmento" role="group" aria-label={i.nombre}>
                      <button aria-pressed={valor === 'apto'} disabled={guardando} onClick={() => marcar(i.id, 'valor', valor === 'apto' ? '' : 'apto', `${i.nombre}: ${valor === 'apto' ? 'sin dato' : 'apto'}`)}>Apto</button>
                      <button aria-pressed={valor === 'no_apto'} className="rechazar" disabled={guardando} onClick={() => marcar(i.id, 'valor', valor === 'no_apto' ? '' : 'no_apto', `${i.nombre}: ${valor === 'no_apto' ? 'sin dato' : 'no apto'}`)}>No apto</button>
                    </div>
                  </div>
                );
              })}
              <div className="item-ficha"><div className="casillas" style={{ gridColumn: '1 / -1' }}>
                {CONFIG.checklistGH.filter((i) => i.tipo === 'chequeo').map((i) => <Casilla key={i.id} itemId={i.id} />)}
              </div></div>
            </div>
          </section>

          {/* 5. Bitácora */}
          <section>
            <h3>Bitácora</h3>
            <ul className="bitacora" style={{ marginTop: 10 }}>
              {[...(exp.bitacora || [])].reverse().map((b, i) => (
                <li key={i}><div>{b.accion}<span>{b.usuario}, {fechaCorta(b.fecha)}</span></div></li>
              ))}
            </ul>
            <p className="nota-seccion" style={{ marginTop: 12 }}>Carpeta: {C.candidatos} / {c.nombreCarpeta}</p>
          </section>
        </div>
      </aside>
      {pidiendo && (
        <HojaCorrecciones exp={exp} rechazados={rechazados} faltantes={faltantes} guardando={guardando}
                          avisar={avisar} usuario={usuario} onRegistrar={registrarCorreccion} onCerrar={() => setPidiendo(false)} />
      )}
    </>
  );
}

/* ---------- Hoja "Pedir correcciones" (sale encima de la ficha) ---------- */

/**
 * Elige qué documentos pedir corregir, arma el link (sección 6B) y el mensaje, y deja
 * copiarlo o mandarlo por WhatsApp o correo. La primera vez que se copia o se manda,
 * la corrección queda registrada en el expediente (onRegistrar) y ya no se puede cambiar.
 *   rechazados: [{ id, motivo }] (vienen activados) · faltantes: [id] (vienen apagados)
 */
function HojaCorrecciones({ exp, rechazados, faltantes, guardando, avisar, usuario, onRegistrar, onCerrar }) {
  const [eleccion, setEleccion] = useState(() => Object.fromEntries([
    ...rechazados.map((x) => [x.id, { activo: true, motivo: x.motivo }]),
    ...faltantes.map((id) => [id, { activo: false, motivo: 'Falta este documento' }]),
  ]));
  const [huella, setHuella] = useState('');
  const [registrada, setRegistrada] = useState(null); // número de la corrección ya registrada
  const n = registrada || siguienteCorreccion(exp);

  useEffect(() => { huellaCedula(exp.cedula).then(setHuella); }, [exp.cedula]);
  useEffect(() => {
    const alTeclear = (ev) => ev.key === 'Escape' && onCerrar();
    window.addEventListener('keydown', alTeclear);
    return () => window.removeEventListener('keydown', alTeclear);
  }, []);

  const elegidos = Object.entries(eleccion).filter(([, v]) => v.activo).map(([id, v]) => ({ id, motivo: v.motivo.slice(0, MAXIMO_MOTIVO) }));
  const listo = elegidos.length > 0 && !!huella;
  const link = listo ? linkDeCorreccion(n, huella, elegidos) : '';
  const mensaje = listo ? mensajeDeCorreccion(exp.nombre, elegidos, link) : '';
  const celular = String(exp.celular || '').replace(/\D/g, '');

  /** Registra la corrección la primera vez (copiar o enviar cuenta como "pedirla"). */
  async function registrarSiFalta() {
    if (registrada) return true;
    const ok = await onRegistrar({ n, fecha: new Date().toISOString(), por: usuario, documentos: elegidos, recibida: null });
    if (ok) setRegistrada(n);
    return ok;
  }

  async function copiar() {
    try { await navigator.clipboard.writeText(mensaje); }
    catch (e) { avisar('No se pudo copiar automáticamente: selecciona el mensaje y cópialo a mano', 'error'); return; }
    if (await registrarSiFalta()) avisar(`Mensaje copiado. Corrección ${n} registrada`);
  }
  /** WhatsApp y correo son enlaces normales (así el navegador no los bloquea); al tocarlos se registra. */
  const alEnviar = (ev) => { if (!listo || guardando) { ev.preventDefault(); return; } registrarSiFalta(); };

  const Fila = ({ id }) => {
    const v = eleccion[id];
    return (
      <label className="item-ficha sin-punto">
        <span className="fila-texto">
          <span className="item-titulo">{nombreDocumento(id)}</span>
          <span className={v.motivo === 'Falta este documento' ? 'nombre-archivo' : 'motivo-texto'}>{v.motivo}</span>
        </span>
        <input type="checkbox" role="switch" className="interruptor" checked={v.activo} disabled={!!registrada || guardando}
               onChange={() => setEleccion({ ...eleccion, [id]: { ...v, activo: !v.activo } })}
               aria-label={`Pedir ${nombreDocumento(id)}`} />
      </label>
    );
  };

  return (
    <>
      <div className="velo encima" onClick={onCerrar} />
      <aside className="detalle hoja-encima" role="dialog" aria-modal="true" aria-label="Pedir correcciones">
        <div className="agarre" aria-hidden="true" />
        <div className="detalle-cabeza">
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, alignItems: 'flex-start' }}>
            <div className="fila-texto">
              <h2>Pedir correcciones</h2>
              <span className="fila-sub">{nombreBonito(exp.nombre)} — corrección {n}</span>
            </div>
            <button className="boton boton-texto" style={{ fontWeight: 600, fontSize: 17 }} onClick={onCerrar}>{registrada ? 'Listo' : 'Cancelar'}</button>
          </div>
        </div>
        <div className="detalle-cuerpo">
          {rechazados.length > 0 && (
            <section>
              <h3>Rechazados</h3>
              <div className="tarjeta">{rechazados.map((x) => <Fila key={x.id} id={x.id} />)}</div>
            </section>
          )}
          {faltantes.length > 0 && (
            <section>
              <h3>No los mandó</h3>
              <div className="tarjeta">{faltantes.map((id) => <Fila key={id} id={id} />)}</div>
              <p className="nota-seccion">Actívalos solo si este candidato los necesita.</p>
            </section>
          )}
          <section>
            <h3>Mensaje para el candidato</h3>
            {listo ? <pre className="mensaje-previo">{mensaje}</pre>
                   : <p className="nota-seccion">{elegidos.length ? 'Preparando el link…' : 'Activa al menos un documento.'}</p>}
            <p className="nota-seccion">
              {registrada
                ? `La corrección ${registrada} quedó registrada en la bitácora y el candidato pasó a “Con correcciones”.`
                : 'Al copiar o enviar el mensaje, la corrección queda registrada en el expediente.'}
            </p>
          </section>
          <div className="acciones-hoja">
            <button className="boton boton-principal" disabled={!listo || guardando} onClick={copiar}>Copiar mensaje</button>
            {celular && (
              <a className="boton boton-secundario" aria-disabled={!listo || guardando} onClick={alEnviar}
                 href={listo ? `https://wa.me/57${celular}?text=${encodeURIComponent(mensaje)}` : undefined}
                 target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a>
            )}
            {exp.correo && (
              <a className="boton boton-secundario" aria-disabled={!listo || guardando} onClick={alEnviar}
                 href={listo ? `mailto:${exp.correo}?subject=${encodeURIComponent('Corrección de tus documentos de ingreso — Supertiendas Cañaveral')}&body=${encodeURIComponent(mensaje)}` : undefined}>
                Abrir correo
              </a>
            )}
          </div>
          {!celular && !exp.correo && <p className="nota-seccion">Este candidato no dejó celular ni correo: copia el mensaje y mándaselo por otro medio.</p>}
        </div>
      </aside>
    </>
  );
}

/* ---------- Papelera: no contratados por unos días ---------- */

/**
 * Lista de no contratados en la Papelera, con los días que les quedan.
 * Recuperar → vuelve a Candidatos; Eliminar ya → se borra (pide confirmación).
 */
function Papelera({ lista, cargando, onRecuperar, onEliminar, onRecargar, ocupado }) {
  const diasQueQuedan = (fecha) => Math.max(0, Math.ceil((new Date(fecha) - Date.now()) / MS_POR_DIA));
  return (
    <>
      <header className="encabezado">
        <div>
          <h1>Papelera</h1>
          <p>Los no contratados quedan aquí {plural(CONFIG.diasPapelera, 'día', 'días')} por si hubo un error. Después se eliminan solos.</p>
        </div>
        <button className="boton boton-secundario" onClick={onRecargar} disabled={cargando}><Icono nombre="recargar" tamano={18} /> Actualizar</button>
      </header>
      <div className="tarjeta">
        {!lista.length ? (
          <div className="vacio">
            <div className="icono-caja"><Icono nombre="papelera" tamano={28} /></div>
            <h3>La Papelera está vacía</h3>
            <p>Cuando marques a alguien como “No contratado”, queda aquí {plural(CONFIG.diasPapelera, 'día', 'días')} antes de eliminarse.</p>
          </div>
        ) : lista.map((item) => {
          const quedan = item.eliminarDesde ? diasQueQuedan(item.eliminarDesde) : null;
          const e = item.expediente;
          return (
            <div className="fila" key={item.nombreCarpeta}>
              <div className="icono-caja ojo"><Icono nombre="papelera" /></div>
              <div className="fila-texto">
                <span className="fila-titulo">{nombreBonito(item.nombre)}</span>
                <span className="fila-sub"><span className="numeros">{siglaDocumento(e && e.tipoDocumento)} {item.cedula || '—'}</span>{e && e.cargo ? ` — ${e.cargo}` : ''}</span>
                <span className="fila-pista">
                  {e && e.enPapelera ? `${e.enPapelera.por || '—'} lo marcó como no contratado el ${fechaCorta(e.enPapelera.fecha)} — ` : ''}
                  {quedan === null ? 'Sin fecha: elimínalo a mano.' : quedan === 0 ? 'Se elimina la próxima vez que se actualice.' : `Se elimina en ${plural(quedan, 'día', 'días')} (${fechaCorta(item.eliminarDesde)}).`}
                </span>
              </div>
              <div className="fila-lado">
                <button className="boton boton-suave" disabled={ocupado} onClick={() => onRecuperar(item)}>Recuperar</button>
                <button className="boton boton-texto peligro" disabled={ocupado} onClick={() => onEliminar(item)}>Eliminar ya</button>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

/* ---------- Ajustes: valores que comparte todo el equipo ---------- */

/**
 * Edita una copia ("borrador") de los ajustes y la guarda con onGuardar(valores).
 * info: lo que se leyó de ajustes.json (quién y cuándo los cambió), o null si son los de fábrica.
 */
function Ajustes({ info, onGuardar, onRecargar, cargando }) {
  const [borrador, setBorrador] = useState(ajustesActuales);
  const [guardando, setGuardando] = useState(false);
  useEffect(() => { setBorrador(ajustesActuales()); }, [info]);   // si otra persona los cambió y se actualizó
  const cambiado = JSON.stringify(borrador) !== JSON.stringify(ajustesActuales());
  const poner = (campo, valor) => setBorrador({ ...borrador, [campo]: valor });

  // Checklist: cambiar, mover, quitar y agregar ítems
  const items = borrador.checklistGH;
  const cambiarItem = (i, cambios) => poner('checklistGH', items.map((x, j) => (j === i ? { ...x, ...cambios } : x)));
  const moverItem = (i, d) => { const l = [...items]; const [x] = l.splice(i, 1); l.splice(i + d, 0, x); poner('checklistGH', l); };
  const quitarItem = (i) => poner('checklistGH', items.filter((_, j) => j !== i));
  const agregarItem = () => poner('checklistGH', [...items, { id: '', nombre: '', tipo: 'archivo' }]);
  // Motivos rápidos
  const motivos = borrador.motivosRapidos;
  const cambiarMotivo = (i, texto) => poner('motivosRapidos', motivos.map((m, j) => (j === i ? texto : m)));

  async function guardar() {
    setGuardando(true);
    await onGuardar(borrador);
    setGuardando(false);
  }

  return (
    <>
      <header className="encabezado">
        <div>
          <h1>Ajustes</h1>
          <p>{info ? `Últimos cambios: ${info.por || '—'}, ${fechaCorta(info.actualizado)} — todo el equipo usa estos valores.`
                   : 'Se están usando los valores de fábrica. Lo que guardes aquí lo usará todo el equipo.'}</p>
        </div>
        <div className="acciones">
          <button className="boton boton-secundario" onClick={onRecargar} disabled={cargando || guardando}><Icono nombre="recargar" tamano={18} /> Actualizar</button>
          <button className="boton boton-secundario" disabled={!cambiado || guardando} onClick={() => setBorrador(ajustesActuales())}>Descartar cambios</button>
          <button className="boton boton-principal" disabled={!cambiado || guardando} onClick={guardar}>{guardando ? 'Guardando…' : 'Guardar ajustes'}</button>
        </div>
      </header>

      <section className="grupo">
        <h3 className="grupo-titulo">Checklist de Gestión Humana (lo que se completa en cada ficha)</h3>
        <div className="tarjeta">
          {items.map((item, i) => (
            <div className="ajuste-item" key={i}>
              <input className="campo-ajuste" value={item.nombre} maxLength={80} placeholder="Nombre del ítem, ej. Afiliación ARL"
                     aria-label={`Nombre del ítem ${i + 1}`} onChange={(e) => cambiarItem(i, { nombre: e.target.value })} />
              <select className="selector" value={item.tipo} aria-label={`Tipo del ítem ${i + 1}`} onChange={(e) => cambiarItem(i, { tipo: e.target.value })}>
                {TIPOS_CHECKLIST.map(([id, texto]) => <option key={id} value={id}>{texto}</option>)}
              </select>
              <div className="botones-item">
                <button className="boton boton-texto" disabled={i === 0} aria-label="Subir" onClick={() => moverItem(i, -1)}>↑</button>
                <button className="boton boton-texto" disabled={i === items.length - 1} aria-label="Bajar" onClick={() => moverItem(i, 1)}>↓</button>
                <button className="boton boton-texto peligro" onClick={() => quitarItem(i)}>Quitar</button>
              </div>
              <input className="campo-ajuste enlace" type="url" value={item.enlace || ''} placeholder="Página de la plataforma (opcional), ej. https://www.positiva.gov.co"
                     aria-label={`Página de ${item.nombre || `el ítem ${i + 1}`}`} onChange={(e) => cambiarItem(i, { enlace: e.target.value })} />
            </div>
          ))}
          <div className="ajuste-item sin-tipo"><button className="boton boton-suave" onClick={agregarItem}>Agregar ítem</button></div>
        </div>
        <p className="grupo-pie">Si le pones la página a un ítem, en la ficha de cada candidato sale el botón “Abrir página” para ir directo a esa plataforma. Si quitas un ítem, lo que ya se había hecho en cada candidato no se borra: solo deja de mostrarse. Los ítems sin nombre no se guardan.</p>
      </section>

      <section className="grupo">
        <h3 className="grupo-titulo">Motivos rápidos de rechazo (botones al rechazar un documento)</h3>
        <div className="tarjeta">
          {motivos.map((m, i) => (
            <div className="ajuste-item sin-tipo" key={i}>
              <input className="campo-ajuste" value={m} maxLength={160} aria-label={`Motivo ${i + 1}`} onChange={(e) => cambiarMotivo(i, e.target.value)} />
              <button className="boton boton-texto peligro" onClick={() => poner('motivosRapidos', motivos.filter((_, j) => j !== i))}>Quitar</button>
            </div>
          ))}
          <div className="ajuste-item sin-tipo"><button className="boton boton-suave" onClick={() => poner('motivosRapidos', [...motivos, ''])}>Agregar motivo</button></div>
        </div>
      </section>

      <section className="grupo">
        <h3 className="grupo-titulo">Tiempos y límites</h3>
        <div className="tarjeta">
          {[
            ['diasAlerta', 'Días de alerta', 'Desde cuántos días esperando el número se pone en rojo'],
            ['diasPapelera', 'Días en la Papelera', 'Cuánto tiempo se guarda un no contratado antes de eliminarse'],
            ['tamanoMaximoGHMB', 'Peso máximo de los archivos de GH (MB)', 'Lo más que puede pesar un archivo que sube Gestión Humana'],
          ].map(([campo, titulo, pista]) => (
            <label className="fila-numero" key={campo}>
              <span>{titulo}<small>{pista}</small></span>
              <input className="campo-ajuste numero" type="number" min="1" max={campo === 'tamanoMaximoGHMB' ? 100 : 90}
                     value={borrador[campo]} onChange={(e) => poner(campo, e.target.value === '' ? '' : Number(e.target.value))} />
            </label>
          ))}
        </div>
      </section>

      <section className="grupo">
        <h3 className="grupo-titulo">App del candidato</h3>
        <div className="tarjeta fila-campo">
          <label htmlFor="enlace-app">Dirección de la app (va en los mensajes de corrección)</label>
          <input id="enlace-app" type="url" value={borrador.enlaceAppCandidato} onChange={(e) => poner('enlaceAppCandidato', e.target.value)} />
        </div>
      </section>

      <div style={{ textAlign: 'center' }}>
        <button className="boton boton-texto peligro" onClick={() => setBorrador(JSON.parse(JSON.stringify(CONFIG_FABRICA)))}>
          Poner los valores de fábrica
        </button>
        <p className="nota">Esto solo cambia lo que ves aquí: para que quede, toca “Guardar ajustes”.</p>
      </div>
    </>
  );
}

/* ---------- Diálogo de confirmación (alerta de iOS con botón rojo) ---------- */

/**
 * titulo, texto y textoBoton se muestran tal cual. El botón rojo llama onConfirmar();
 * mientras trabaja, los botones quedan inactivos.
 */
function DialogoConfirmar({ titulo, texto, textoBoton, textoTrabajando, onConfirmar, onCancelar }) {
  const [trabajando, setTrabajando] = useState(false);
  return (
    <div className="dialogo-fondo" onClick={() => !trabajando && onCancelar()}>
      <div className="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="titulo-confirmar" onClick={(e) => e.stopPropagation()}>
        <h2 id="titulo-confirmar">{titulo}</h2>
        <p>{texto}</p>
        <div className="acciones">
          <button className="boton boton-secundario" disabled={trabajando} onClick={onCancelar}>Cancelar</button>
          <button className="boton boton-peligro" disabled={trabajando}
                  onClick={async () => { setTrabajando(true); await onConfirmar(); }}>
            {trabajando ? textoTrabajando : textoBoton}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ==========================================================================
   10. APP PRINCIPAL
   ========================================================================== */
function App() {
  const [fase, setFase] = useState('cargando');      // cargando | arranque | listo
  const [raiz, setRaiz] = useState(null);             // carpeta "Hojas de vida"
  const [usuario, setUsuario] = useState('');
  const [modoEjemplo, setModoEjemplo] = useState(null); // null = carpeta real
  const [recordada, setRecordada] = useState(null);   // carpeta recordada (pide permiso)
  const [errorArranque, setErrorArranque] = useState('');
  const [vista, setVista] = useState('bandeja');
  const [bandeja, setBandeja] = useState([]);
  const [candidatos, setCandidatos] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [procesando, setProcesando] = useState(false);
  const [lote, setLote] = useState(null);
  const [abierto, setAbierto] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [editarNombre, setEditarNombre] = useState(false);
  const [confirmar, setConfirmar] = useState(null);   // diálogo de confirmación abierto (props de DialogoConfirmar)
  const [papelera, setPapelera] = useState([]);       // no contratados en la Papelera
  const [ocupado, setOcupado] = useState(false);      // moviendo carpetas (Papelera)
  const [ajustesInfo, setAjustesInfo] = useState(null); // lo leído de ajustes.json (o null = valores de fábrica)
  const temporizador = useRef(null);

  /** Muestra un aviso abajo por unos segundos. */
  const avisar = useCallback((texto, tipo = 'ok') => {
    setAviso({ texto, tipo });
    clearTimeout(temporizador.current);
    temporizador.current = setTimeout(() => setAviso(null), tipo === 'error' ? 7000 : 3500);
  }, []);

  // Al abrir: ¿hay una carpeta recordada?
  useEffect(() => {
    (async () => {
      const [carpeta, u] = await Promise.all([recuperar('carpeta'), recuperar('usuario')]);
      if (u) setUsuario(u);
      if (carpeta && u) setRecordada(carpeta);
      setFase('arranque');
    })();
  }, []);

  /** Lee de nuevo la bandeja y los candidatos. */
  const recargar = useCallback(async (carpeta = raiz) => {
    if (!carpeta) return;
    setCargando(true);
    try {
      // Primero los ajustes del equipo (cambian el checklist, los días de la Papelera…)
      const ajustes = await leerAjustes(carpeta);
      aplicarAjustes(ajustes && ajustes.valores);
      setAjustesInfo(ajustes);
      // Luego se elimina de la Papelera lo que ya cumplió el plazo
      const eliminados = await limpiarPapelera(carpeta);
      if (eliminados) avisar(eliminados === 1
        ? `Se eliminó 1 no contratado que ya cumplió ${plural(CONFIG.diasPapelera, 'día', 'días')} en la Papelera`
        : `Se eliminaron ${eliminados} no contratados que ya cumplieron ${plural(CONFIG.diasPapelera, 'día', 'días')} en la Papelera`);
      setPapelera(await leerPapelera(carpeta));
      const items = await buscarEnRecibidos(carpeta);
      setBandeja(items);
      setCandidatos(await leerCandidatos(carpeta));
      // Revisa cada archivo de la bandeja (se van mostrando a medida que terminan)
      const revisados = [];
      for (const item of items) revisados.push({ ...item, analisis: await analizarArchivo(item, carpeta) });
      setBandeja(revisados);
    } catch (e) {
      console.error(e);
      avisar(`No se pudo leer la carpeta: ${e.message}`, 'error');
    } finally { setCargando(false); }
  }, [raiz, avisar]);

  /** Lee de nuevo solo el listado de candidatos (después de cambiar una ficha). */
  const recargarCandidatos = useCallback(async () => {
    if (raiz) setCandidatos(await leerCandidatos(raiz));
  }, [raiz]);

  /** Empieza a trabajar con una carpeta (real o de ejemplo). */
  async function entrar(carpeta, nombreUsuario, ejemplo = null) {
    const creadas = await prepararEstructura(carpeta);
    setRaiz(carpeta); setUsuario(nombreUsuario); setModoEjemplo(ejemplo);
    setVista('bandeja'); setFase('listo'); setErrorArranque('');
    if (!ejemplo) {
      await recordar('carpeta', carpeta);
      await recordar('usuario', nombreUsuario);
      if (creadas.length) avisar(`Se crearon las carpetas: ${creadas.join(', ')}`);
    }
    await recargar(carpeta);
  }

  async function alElegirCarpeta(carpeta, nombreUsuario, error) {
    if (error || !carpeta) {
      setErrorArranque(error && error.name === 'SecurityError'
        ? 'El navegador no deja abrir carpetas desde esta vista previa. Abre el panel en su propia pestaña (GitHub Pages).'
        : `No se pudo abrir la carpeta: ${error ? error.message : ''}`);
      return;
    }
    try { await entrar(carpeta, nombreUsuario); }
    catch (e) { setErrorArranque(`No se pudo preparar la carpeta: ${e.message}`); }
  }

  async function reabrir(opcion) {
    if (opcion === 'otra') { setRecordada(null); return; }
    try {
      const permiso = await recordada.requestPermission({ mode: 'readwrite' });
      if (permiso !== 'granted') { setErrorArranque('Sin permiso no se puede leer la carpeta. Vuelve a intentarlo y acepta.'); return; }
      await entrar(recordada, usuario);
    } catch (e) {
      setErrorArranque('No se encontró la carpeta. Puede que la hayan movido o renombrado: elígela de nuevo.');
      setRecordada(null);
    }
  }

  async function abrirEjemplo(nombreUsuario, modo = 'normal') {
    setFase('cargando');
    aplicarAjustes(null); // el ejemplo empieza con los valores de fábrica
    const carpeta = await crearCarpetaDeEjemplo(modo);
    await entrar(carpeta, nombreUsuario, modo);
  }

  /** Procesa un paquete de la bandeja (envío normal o corrección). */
  async function procesar(item, silencioso = false) {
    setProcesando(true);
    try {
      if (item.analisis && item.analisis.tipo === 'correccion') {
        const r = await procesarCorreccion(raiz, item, usuario);
        if (!silencioso) avisar(`Se recibió la corrección ${r.n} de ${nombreBonito(r.nombre)}`);
        return true;
      }
      const r = await procesarZip(raiz, item, usuario);
      if (!silencioso) avisar(r.esNuevo ? `${nombreBonito(r.nombre)} ya está en Candidatos` : `Se actualizó a ${nombreBonito(r.nombre)}`);
      return true;
    } catch (e) {
      console.error(e);
      avisar(e instanceof ErrorChoque ? e.message : `No se pudo procesar ${item.nombre}: ${e.message}`, 'error');
      return false;
    } finally {
      setProcesando(false);
      if (!silencioso) await recargar();
    }
  }

  async function procesarTodos() {
    const listos = bandeja.filter((x) => x.analisis && (x.analisis.tipo === 'envio' || x.analisis.tipo === 'correccion'));
    let bien = 0;
    for (let i = 0; i < listos.length; i++) {
      setLote({ hechos: i, total: listos.length });
      if (await procesar(listos[i], true)) bien++;
    }
    setLote(null);
    await recargar();
    avisar(bien === listos.length ? `Se procesaron ${plural(bien, 'paquete', 'paquetes')}` : `Se procesaron ${bien} de ${listos.length}; revisa los que quedaron`, bien === listos.length ? 'ok' : 'error');
  }

  /**
   * Agrega ZIP a mano (botón "Agregar ZIP" o arrastrando): los copia a la
   * carpeta Recibidos, como si hubieran llegado por el link de OneDrive.
   */
  async function agregarArchivos(archivos) {
    const zips = archivos.filter((f) => /\.zip$/i.test(f.name));
    if (!zips.length) { avisar('Solo se pueden agregar archivos .zip', 'error'); return; }
    try {
      const recibidos = await subcarpeta(raiz, C.recibidos);
      for (const f of zips) await escribir(recibidos, await nombreLibre(recibidos, f.name), f);
      avisar(`${plural(zips.length, 'ZIP agregado', 'ZIP agregados')} a Recibidos`);
      if (zips.length < archivos.length) avisar(`Se agregaron ${zips.length}; los que no eran .zip se ignoraron`, 'error');
    } catch (e) {
      avisar(`No se pudo agregar: ${e.message}`, 'error');
    }
    await recargar();
  }

  /** "No contratado": pide confirmar y pasa el candidato a la Papelera. */
  function pedirNoContratado(c) {
    setConfirmar({
      titulo: `¿No fue contratado(a)? ${nombreBonito(c.nombre)} pasa a la Papelera`,
      texto: `Sus documentos, los de Gestión Humana y sus ZIP quedan en la Papelera ${plural(CONFIG.diasPapelera, 'día', 'días')}. En ese tiempo puedes recuperarlo; después se elimina todo.`,
      textoBoton: 'Mover a la Papelera', textoTrabajando: 'Moviendo…',
      onConfirmar: async () => {
        try {
          await enviarAPapelera(raiz, c, usuario);
          setAbierto(null);
          avisar(`${nombreBonito(c.nombre)} pasó a la Papelera por ${plural(CONFIG.diasPapelera, 'día', 'días')}`);
        } catch (e) {
          console.error(e);
          avisar(`No se pudo mover a la Papelera: ${e.message}`, 'error');
        }
        setConfirmar(null);
        await recargar();
      },
    });
  }

  /** "Recuperar" de la Papelera. (Ojo: "recuperar" sin más es otra función: la que recuerda la carpeta.) */
  async function recuperarCandidato(item) {
    setOcupado(true);
    try {
      await recuperarDePapelera(raiz, item, usuario);
      avisar(`${nombreBonito(item.nombre)} volvió a Candidatos`);
    } catch (e) {
      console.error(e);
      avisar(`No se pudo recuperar: ${e.message}`, 'error');
    } finally { setOcupado(false); }
    await recargar();
  }

  /** "Eliminar ya" en la Papelera: pide confirmar y borra. */
  function pedirEliminar(item) {
    setConfirmar({
      titulo: `¿Eliminar a ${nombreBonito(item.nombre)} definitivamente?`,
      texto: 'Se borran todos sus documentos, los de Gestión Humana y sus ZIP. Ya no se podrá recuperar desde el panel.',
      textoBoton: 'Eliminar', textoTrabajando: 'Eliminando…',
      onConfirmar: async () => {
        try {
          await eliminarDePapelera(raiz, item);
          avisar(`Se eliminó todo lo de ${nombreBonito(item.nombre)}`);
        } catch (e) {
          console.error(e);
          avisar(`No se pudo eliminar: ${e.message}`, 'error');
        }
        setConfirmar(null);
        await recargar();
      },
    });
  }

  /** Guarda los ajustes del equipo (pantalla Ajustes). */
  async function guardarAjustesDelEquipo(valores) {
    try {
      const archivo = await guardarAjustes(raiz, valores, usuario, ajustesInfo);
      aplicarAjustes(archivo.valores);
      setAjustesInfo(archivo);
      avisar('Ajustes guardados: todo el equipo usará estos valores');
      await recargarCandidatos();
    } catch (e) {
      if (!(e instanceof ErrorChoque)) console.error(e); // el choque es un aviso normal, no un error
      avisar(e instanceof ErrorChoque ? e.message : `No se pudieron guardar los ajustes: ${e.message}`, 'error');
    }
  }

  async function guardarNombre(nombre) {
    setUsuario(nombre); setEditarNombre(false);
    if (!modoEjemplo) await recordar('usuario', nombre);
  }

  function salir() {
    setRaiz(null); setBandeja([]); setCandidatos([]); setPapelera([]); setAbierto(null);
    aplicarAjustes(null); setAjustesInfo(null);
    if (!modoEjemplo) setRecordada(null);
    setModoEjemplo(null); setFase('arranque');
  }

  if (fase === 'cargando') {
    return <div className="vacio" style={{ minHeight: '100vh', justifyContent: 'center' }}><span className="girando"><Icono nombre="cargando" tamano={28} /></span><p>Preparando…</p></div>;
  }
  if (fase === 'arranque') {
    return <PantallaArranque onCarpeta={alElegirCarpeta} onEjemplo={(u) => abrirEjemplo(u)}
                             carpetaRecordada={recordada && recordada.name} onReabrir={reabrir} error={errorArranque} />;
  }

  const pendientes = bandeja.filter((x) => !x.analisis || x.analisis.tipo !== 'invalido').length;
  return (
    <div className="marco">
      <BarraLateral vista={vista} setVista={setVista} pendientes={pendientes} enPapelera={papelera.length} usuario={usuario}
                    carpeta={raiz && raiz.name} esEjemplo={!!modoEjemplo}
                    onCambiarUsuario={() => setEditarNombre(true)} onSalir={salir} />
      <main className="trabajo">
        {vista === 'bandeja' && (
          <Bandeja items={bandeja} cargando={cargando} onRecargar={() => recargar()} onProcesar={(i) => procesar(i)}
                   onProcesarTodos={procesarTodos} procesando={procesando} lote={lote} onAgregar={agregarArchivos} />
        )}
        {vista === 'ajustes' && (
          <Ajustes info={ajustesInfo} cargando={cargando} onRecargar={() => recargar()} onGuardar={guardarAjustesDelEquipo} />
        )}
        {vista === 'papelera' && (
          <Papelera lista={papelera} cargando={cargando} ocupado={ocupado} onRecargar={() => recargar()}
                    onRecuperar={recuperarCandidato} onEliminar={pedirEliminar} />
        )}
        {vista === 'listos' && (
          <Candidatos lista={candidatos} cargando={cargando} onAbrir={setAbierto} onRecargar={() => recargar()} modo="listos" />
        )}
        {vista === 'candidatos' && (
          <Candidatos lista={candidatos} cargando={cargando} onAbrir={setAbierto} onRecargar={() => recargar()} />
        )}
      </main>
      {/* Al cerrar la ficha se revisa otra vez la bandeja: una corrección recién pedida cambia los avisos */}
      {abierto && <Ficha c={abierto} usuario={usuario} avisar={avisar} onCambio={recargarCandidatos}
                         onCerrar={() => { setAbierto(null); recargar(); }} onNoContratado={pedirNoContratado} />}
      {confirmar && <DialogoConfirmar {...confirmar} onCancelar={() => setConfirmar(null)} />}
      {editarNombre && <DialogoNombre actual={usuario} onGuardar={guardarNombre} onCancelar={() => setEditarNombre(false)} />}
      {aviso && (
        <div className={`aviso-flotante ${aviso.tipo === 'error' ? 'error' : ''} ${modoEjemplo ? 'sobre-selector' : ''}`} role="status">
          {aviso.tipo !== 'error' && <Icono nombre="listo" tamano={18} />}{aviso.texto}
        </div>
      )}
      {modoEjemplo && (
        <div className="selector-prueba" role="group" aria-label="Datos de ejemplo">
          {[['normal', 'Normal'], ['peor', 'Peor caso'], ['vacio', 'Vacío'], ['uno', 'Uno']].map(([id, texto]) => (
            <button key={id} aria-pressed={modoEjemplo === id} onClick={() => abrirEjemplo(usuario, id)}>{texto}</button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
</body>
</html>
